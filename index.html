ن الطائر.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q9","n":9,"stem":"سعيد : مسرور","opts":["غاضب : هادئ","حزين : كئيب","مريض : طبيب","جائع : شبعان"],"ans":"ب","why":"ترادف: الحزين بمعنى الكئيب. والخياران (أ) و(د) تضاد.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q10","n":10,"stem":"بذر : حصاد","opts":["تخرّج : دراسة","كتابة : قلم","سفر : حقيبة","خِطبة : زواج"],"ans":"د","why":"تتابع زمني: البذر يسبق الحصاد، والخِطبة تسبق الزواج. و«تخرّج : دراسة» ترتيبها معكوس.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q11","n":11,"stem":"ريش : طائر","opts":["جناح : طائرة","حراشف : سمكة","قرن : ثور","ظُفر : قطة"],"ans":"ب","why":"غطاء الجسم وصاحبه: الريش يغطي جسم الطائر، والحراشف تغطي جسم السمكة. أما القرن والظفر فجزءان بارزان لا غطاء.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q12","n":12,"stem":"شاعر : قصيدة","opts":["مؤلف : رواية","قارئ : كتاب","مغنٍّ : مسرح","ناقد : أديب"],"ans":"أ","why":"مبدع ونتاجه: الشاعر يُبدع القصيدة، والمؤلف يُبدع الرواية. والقارئ لا يُنتج الكتاب.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q13","n":13,"stem":"مشط : شعر","opts":["مقص : ورق","إبرة : خيّاط","فرشاة : أسنان","مطرقة : نجّار"],"ans":"ج","why":"أداة للعناية بجزء من الجسم: المشط للشعر، والفرشاة للأسنان.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q14","n":14,"stem":"ساعة : دقيقة","opts":["يوم : أسبوع","صباح : مساء","سنة : شهر","أمس : غد"],"ans":"ج","why":"كل وجزء: الساعة تتكوّن من دقائق، والسنة تتكوّن من شهور. و«يوم : أسبوع» معكوسة.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q15","n":15,"stem":"إسراف : فقر","opts":["قناعة : طمع","صدق : ثقة","ثروة : بنك","عمل : موظف"],"ans":"ب","why":"سبب ونتيجة: الإسراف يؤدي إلى الفقر، والصدق يؤدي إلى الثقة.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q16","n":16,"stem":"عالِم : علماء","opts":["كتب : كتاب","شاعر : شعراء","معلم : مدرسة","جيش : جندي"],"ans":"ب","why":"مفرد ثم جمعه بالترتيب نفسه: شاعر/شعراء. و«كتب : كتاب» جمع ثم مفرد، فهي معكوسة.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q17","n":17,"stem":"نسيم : إعصار","opts":["رذاذ : طوفان","هواء : رئة","شتاء : صيف","غيم : مطر"],"ans":"أ","why":"تدرّج في الشدة: النسيم ريح خفيفة والإعصار ريح عاتية، والرذاذ ماء خفيف والطوفان ماء غامر.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q18","n":18,"stem":"صحراء : جفاف","opts":["قطب : برودة","بحر : سفينة","جبل : وادٍ","مدينة : قرية"],"ans":"أ","why":"صفة ملازمة: الجفاف صفة ملازمة للصحراء، والبرودة صفة ملازمة للقطب.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q19","n":19,"stem":"طائرة : طيّار","opts":["حافلة : طريق","سيارة : راكب","قطار : محطة","سفينة : ربّان"],"ans":"د","why":"وسيلة وقائدها: الطيّار يقود الطائرة، والربّان يقود السفينة. والراكب لا يقود.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q20","n":20,"stem":"مقدمة : خاتمة","opts":["عنوان : كتاب","افتتاح : اختتام","فصل : رواية","سطر : صفحة"],"ans":"ب","why":"بداية ونهاية: المقدمة بداية والخاتمة نهاية، والافتتاح بداية والاختتام نهاية.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q21","n":21,"stem":"لؤلؤ : محار","opts":["حرير : دودة القز","ماء : كوب","نفط : سيارة","ذهب : خاتم"],"ans":"أ","why":"ناتج والكائن الحي الذي يُنتجه: المحار يُنتج اللؤلؤ، ودودة القز تُنتج الحرير.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q22","n":22,"stem":"معصم : ساعة","opts":["قدم : ساق","إصبع : خاتم","رأس : شعر","عين : دمعة"],"ans":"ب","why":"موضع من الجسم وما يُلبس فيه: الساعة تُلبس في المعصم، والخاتم يُلبس في الإصبع.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q23","n":23,"stem":"شجاع : شجاعة","opts":["علم : عالِم","صبر : صابر","جميل : قبيح","كريم : كرم"],"ans":"د","why":"صفة ثم مصدرها بالترتيب نفسه: كريم/كرم. والخياران (أ) و(ب) معكوسان: مصدر ثم صفة.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q24","n":24,"stem":"بئر : ماء","opts":["كتاب : معرفة","حقل : مزارع","منجم : ذهب","سوق : تاجر"],"ans":"ج","why":"موضع يُحفر ليُستخرج منه شيء: البئر يُستخرج منها الماء، والمنجم يُستخرج منه الذهب. والمعرفة لا تُستخرج بالحفر.","skill":"التناظر اللفظي","src":"u1"},{"id":"u1-q25","n":25,"stem":"تلميذ : معلم","opts":["متدرّب : مدرّب","لاعب : ملعب","مريض : طبيب","ابن : جد"],"ans":"أ","why":"متعلّم ومن يُعلّمه: المعلم يُعلّم التلميذ، والمدرّب يُدرّب المتدرّب. والطبيب يعالج المريض ولا يُعلّمه.","skill":"التناظر اللفظي","src":"u1"}],"mistakes":["النظر في الخيارات قبل صياغة العلاقة.","إهمال اتجاه العلاقة والوقوع في الخيار المعكوس.","الاكتفاء بجملة رابطة عامة تصلح لخيارين.","اختيار الخيار الذي يشترك مع السؤال في الموضوع لا في نوع العلاقة.","التخمين السريع لأن السؤال يبدو سهلًا؛ وهي أكثر مهارة تُفقد فيها الدرجات بهذا السبب."]},{"key":"u2","title":"الوحدة الثانية: إكمال الجمل","label":"الوحدة الثانية","skill":"إكمال الجمل","num":"2","note":"","intro":["يعرض السؤال جملة أو نصًّا قصيرًا فيه فراغ أو فراغان، والمطلوب اختيار الكلمة أو الكلمات التي تجعل الجملة مستقيمة في معناها وتركيبها.","القاعدة الحاكمة: الجملة نفسها تخبرك بالإجابة. فكل جملة تحمل إشارات — أداة ربط، أو تضادًّا، أو تعليلًا — تحدّد نوع الكلمة الناقصة قبل أن تقرأ الخيارات.","يخطئ أكثر الطلاب حين يبحثون عن الكلمة «الأجمل» بدل الكلمة التي يفرضها سياق الجملة."],"shape":{"stem":"لم يكن الطريق سهلًا، ......... أنه لم يستسلم.","opts":["لأن","غير","حتى","كي"],"note":"الفراغ هنا يحتاج أداة استدراك؛ لأن شطر الجملة الثاني يخالف الأول."},"shapeTitle":"شكل السؤال","table":{"title":"أدوات الربط ودلالتها","headers":["نوع العلاقة","الأدوات","ما تفرضه على الفراغ"],"rows":[["استدراك ومخالفة","لكنْ، غير أن، إلا أن، بيدَ أن، مع أن، رغم","ما بعد الأداة يخالف ما قبلها في الاتجاه"],["تعليل","لأن، إذ، حيث، بسبب، نظرًا لـ","ما بعدها سبب لما قبلها"],["نتيجة","لذلك، من ثَمّ، وعليه، فـ","ما بعدها أثر لما قبلها"],["غاية","كي، لكي، حتى، لـ","ما بعدها هدف مقصود مما قبلها"],["توكيد ومماثلة","بل، كذلك، أيضًا، وكما","ما بعدها في اتجاه ما قبلها ويزيده"],["شرط","إنْ، إذا، لو، مَن، متى","جواب الشرط يترتب على فعله"],["تفصيل بعد إجمال","أي، ومنها، وهي","ما بعدها شرحٌ لما قبلها"],["تشبيه","كأن، مثل، شأنه شأن","الطرفان متماثلان في وجه معيّن"],["استثناء","إلا، سوى، خلا","ما بعدها خارج عن حكم ما قبلها"],["تخيير","أو، إما... وإما","الطرفان بديلان لا يجتمعان"]],"note":"أداة الربط هي أسرع مفتاح في هذا القسم: حدّدها أولًا تعرف اتجاه الفراغ."},"levels":null,"strategies":[["اقرأ الجملة كاملة قبل النظر في الخيارات","لا تتوقف عند الفراغ. معنى الجملة كثيرًا ما يتحدّد في آخرها، فقراءة نصفها تقودك إلى خيار يبدو صحيحًا ثم يتبيّن أنه مناقض لبقيتها."],["توقّع الإجابة بكلماتك أنت","ضع في الفراغ كلمة من عندك تناسب المعنى، ثم ابحث في الخيارات عن أقربها إليها. هذا يحميك من الخيار الجذّاب الذي يبدو فصيحًا ولا يناسب السياق."],["حدّد اتجاه الجملة: متوافق أم متضاد","إن كان طرفا الجملة في اتجاه واحد فالفراغ كلمة تسير مع المعنى، وإن كان بينهما استدراك فالفراغ كلمة تخالفه. علامةٌ واحدة مثل «غير أن» تقلب الإجابة رأسًا على عقب."],["في سؤال الفراغين: ابدأ بالفراغ الأسهل","احسم الفراغ الذي تطمئن إليه، ثم احذف كل خيار لا يناسبه دفعة واحدة. لا تُجهد نفسك في الفراغين معًا؛ فالخيار يسقط كاملًا إذا سقط أحد طرفيه."],["اعرض الخيار على الجملة بعد اختياره","أعد قراءة الجملة كاملة بالكلمة التي اخترتها. إن استقام المعنى واستقام التركيب فهي الإجابة، وإن نبا اللفظ عن موضعه فراجع اختيارك."],["راعِ التركيب اللغوي لا المعنى وحده","تأكد من مطابقة الفراغ لما قبله في التعدية وحرف الجر («رغب في» غير «رغب عن»)، وفي الإفراد والجمع، وفي التذكير والتأنيث."]],"examples":[{"kind":"single","n":1,"label":"","stem":"لم يكن الطريق سهلًا، ......... أنه لم يستسلم حتى بلغ غايته.","opts":["لأن","غير","حتى","كي"],"steps":["الشطر الأول: الطريق صعب. والشطر الثاني: لم يستسلم. بين المعنيين مخالفة.","المخالفة تحتاج أداة استدراك، لا تعليلًا ولا غاية.","«لأن» تعليل، و«كي» و«حتى» غاية. تسقط الثلاثة.","«غير أنه» أداة استدراك، وتستقيم بها الجملة."],"ans":"ب","tip":""},{"kind":"single","n":2,"label":"","stem":"يتميز الباحث الجيد بأنه لا يقبل النتيجة إلا بعد ......... ، فالعلم لا يقوم على الظن.","opts":["تسرّع","تمحيص","تجاهل","مبالغة"],"steps":["ما بعد الفاصلة تعليل: «العلم لا يقوم على الظن»، فالمطلوب كلمة تدل على التثبّت.","توقّع الإجابة: «تحقّق» أو «فحص دقيق».","«تسرّع» و«تجاهل» و«مبالغة» كلها تناقض التثبّت.","«تمحيص» أقرب الخيارات إلى ما توقّعناه، ومعناه اختبار الشيء وتنقيته."],"ans":"ب","tip":""},{"kind":"single","n":3,"label":"","stem":"كان الجو ......... في الصباح، ثم ......... بعد الظهر حتى اضطررنا إلى دخول البيت.","opts":["حارًّا – اعتدل","معتدلًا – اشتد حرّه","باردًا – ازداد برودة","ممطرًا – صحا"],"steps":["الفراغ الثاني أسهل؛ فقوله «حتى اضطررنا إلى دخول البيت» يدل على تحوّل إلى الأسوأ.","«اعتدل» و«صحا» تحوّل إلى الأفضل، فيسقط الخياران (أ) و(د).","بقي (ب) و(ج): كلاهما تحوّل إلى الأسوأ.","الفراغ الأول يحسم الأمر: «ثم» تفيد التحوّل، فالحال الأولى غير الثانية. و(ج) يجعل الجو باردًا ثم أشد بردًا وهذا ممكن، لكن (ب) أدق لأن التحول فيها من الاعتدال إلى الشدة، وهو ما يفسّر الاضطرار المفاجئ."],"ans":"ب","tip":"في سؤال الفراغين ابدأ دائمًا بالفراغ الذي فيه قرينة صريحة."},{"kind":"single","n":4,"label":"","stem":"من يزرع الشوك لا يجني به ......... .","opts":["العنب","الألم","الندم","الخسارة"],"steps":["المثل يقوم على المقابلة بين الزرع الرديء والجني الطيب.","توقّع الإجابة: شيء مرغوب فيه، ليكون نفيه معقولًا.","«الألم» و«الندم» و«الخسارة» كلها نتائج سيئة، وهي ما يجنيه زارع الشوك فعلًا، فلا يصح نفيها.","«العنب» شيء طيب، فيستقيم نفيه عن زارع الشوك."],"ans":"أ","tip":"في الأمثال والحِكم، ابحث عن المقابلة بين طرفي العبارة."},{"kind":"single","n":5,"label":"","stem":"لم يقتصر إسهامه على التعليم، ......... تجاوزه إلى تأسيس مكتبة عامة انتفع بها أهل المدينة.","opts":["لكنه","بل","غير أنه","مع أنه"],"steps":["أسلوب «لم يقتصر على... » يقتضي أداة إضراب تبيّن الزيادة، لا أداة استدراك تبيّن المخالفة.","الشطر الثاني ليس مخالفًا للأول بل زائدًا عليه، فالإسهام في الحالين محمود.","«لكنه» و«غير أنه» و«مع أنه» كلها للاستدراك والمخالفة. تسقط.","«بل» للإضراب والترقّي، وهي التي تلازم أسلوب «لم يقتصر»."],"ans":"ب","tip":"بعض التراكيب تفرض أداة بعينها: «لم يقتصر… بل»، و«ليس… فحسب، بل… أيضًا»."},{"kind":"single","n":6,"label":"","stem":"إن الأمم لا تنهض بـ ......... مواردها، وإنما بـ ......... أبنائها.","opts":["وفرة – إتقان","قلة – كسل","ضياع – إهمال","وفرة – ترف"],"steps":["بنية الجملة «لا... وإنما...» تفيد نفي سبب وإثبات سبب آخر، فالطرفان متقابلان وكلاهما مرشّح للنهضة.","الفراغ الثاني هو سبب النهضة الحقيقي، فلا بد أن يكون فضيلة: «كسل» و«إهمال» و«ترف» ليست فضائل. تسقط (ب) و(ج) و(د).","بقي (أ): «لا تنهض بوفرة مواردها وإنما بإتقان أبنائها»، والمعنى مستقيم: الثروة وحدها لا تكفي دون إتقان."],"ans":"أ","tip":""}],"exInstruction":"اختر الكلمة أو الكلمات التي تكمل الفراغ إكمالًا صحيحًا في المعنى والتركيب.","passages":[],"items":[{"id":"u2-q1","n":1,"stem":"اجتهد الطالب طوال العام، ......... حصد المركز الأول.","opts":["لكنه","مع أنه","لذلك","رغم أنه"],"ans":"ج","why":"الشطر الثاني نتيجة للأول، و«لذلك» أداة نتيجة. وبقية الأدوات للاستدراك.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q2","n":2,"stem":"لا تحكم على الكتاب من ......... ، فقد يخفي الغلاف البسيط علمًا غزيرًا.","opts":["مؤلفه","ثمنه","مظهره","حجمه"],"ans":"ج","why":"التعليل بعد الفاصلة يذكر «الغلاف»، وهو المظهر.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q3","n":3,"stem":"كان صوته ......... حتى إن من في آخر القاعة سمعه.","opts":["خافتًا","جهوريًّا","متقطعًا","مبحوحًا"],"ans":"ب","why":"«حتى إن من في آخر القاعة سمعه» نتيجة تقتضي علوّ الصوت، والجهوري هو المرتفع.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q4","n":4,"stem":"لم يكن غنيًّا، ......... كان كريمًا يُؤثر الناس على نفسه.","opts":["لأنه","حيث","كي","غير أنه"],"ans":"د","why":"بين فقره وكرمه مخالفة، والمخالفة تحتاج أداة استدراك.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q5","n":5,"stem":"تحتاج الشجرة إلى ......... طويلة قبل أن تُثمر، فلا تستعجل الحصاد.","opts":["رعاية","لحظات","جذور","أغصان"],"ans":"أ","why":"الوصف بـ«طويلة» والتحذير من الاستعجال يقتضيان مدة من العناية، و«رعاية» وحدها تقبل الوصف بالطول هنا.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q6","n":6,"stem":"......... تتقن عملك ......... تنل ثقة الناس.","opts":["إنْ – ف","لأن – لكن","مع أن – غير","كي – حتى"],"ans":"أ","why":"تركيب شرط وجواب: «إن تتقن عملك فتنل ثقة الناس».","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q7","n":7,"stem":"لم يتحدث المدير عن الأرقام فحسب، ......... عن الأثر الذي تركه المشروع في الحي.","opts":["لكن","بل","أو","إذ"],"ans":"ب","why":"تركيب «لم… فحسب، بل…» يفرض «بل» للإضراب والترقّي.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q8","n":8,"stem":"الكلمة الطيبة ......... لا يكلّف شيئًا وأثره يبقى طويلًا.","opts":["صدقة","عبء","واجب","امتحان"],"ans":"أ","why":"الوصف «لا يكلّف شيئًا وأثره يبقى» يناسب الصدقة، ويناقض العبء والواجب والامتحان.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q9","n":9,"stem":"تراجعت ......... المصنع بعد إضراب العمال، ......... اضطرت الإدارة إلى التفاوض.","opts":["سمعة – كي","خسائر – لكن","إنتاجية – رغم أن","إنتاجية – لذلك"],"ans":"د","why":"التراجع بعد الإضراب يقع في الإنتاجية لا في الخسائر، والتفاوض نتيجة تقتضي «لذلك».","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q10","n":10,"stem":"من علامات العالِم الحق أنه ......... حين يُسأل عما لا يعلم.","opts":["يجادل","يصمت","يقول: لا أدري","يعتذر"],"ans":"ج","why":"الإقرار بالجهل هو علامة العالم الحق، وهو أدق من الصمت أو الاعتذار.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q11","n":11,"stem":"قرأ الكتاب مرتين، ......... لم يستوعب فكرته إلا في الثالثة.","opts":["فـ","بيدَ أنه","بل","لكي"],"ans":"ب","why":"بين القراءة مرتين وعدم الاستيعاب مخالفة، و«بيدَ أن» للاستدراك.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q12","n":12,"stem":"الماء ......... الحياة على الأرض، فلا يستغني عنه كائن.","opts":["قوام","عدو","بديل","خصم"],"ans":"أ","why":"«قوام الشيء» ما يقوم به ويثبت، والتعليل بعدها يؤكد هذا المعنى.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q13","n":13,"stem":"......... كثرت الشائعات ......... وجب التثبت قبل النقل.","opts":["كلما – ازداد","إذا – ف","مع أن – لكن","لأن – كي"],"ans":"ب","why":"تركيب شرط وجواب مستقيم: «إذا كثرت الشائعات فوجب التثبت».","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q14","n":14,"stem":"كان حديثه ......... ، فلم يخرج أحد من المجلس وقد فهم مقصده.","opts":["واضحًا","مقتضبًا","ممتعًا","غامضًا"],"ans":"د","why":"النتيجة أن أحدًا لم يفهم مقصده، وهذا يقتضي الغموض.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q15","n":15,"stem":"لا تُقاس قيمة الإنسان بـ ......... يملك، بل بـ ......... يقدّم.","opts":["من – من","ما – ما","ما – من","كم – كم"],"ans":"ب","why":"«ما» اسم موصول لغير العاقل يناسب المملوك والمقدَّم في الموضعين.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q16","n":16,"stem":"أُغلق الطريق الرئيس، ......... سلك السائقون طرقًا فرعية أطول.","opts":["فـ","مع أن","إلا أن","حتى"],"ans":"أ","why":"سلوك الطرق الفرعية نتيجة مباشرة للإغلاق، والفاء للنتيجة والترتيب.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q17","n":17,"stem":"الثقة بالنفس ......... محمود، ......... الغرور مذموم يُبعد الناس عنك.","opts":["طبع – كي","عيب – لأن","خُلق – لذلك","خُلق – بينما"],"ans":"د","why":"الثقة خُلق محمود، و«بينما» تقابل بينه وبين الغرور المذموم.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q18","n":18,"stem":"اشتد المرض عليه ......... أنه واصل عمله ولم يتغيّب يومًا.","opts":["غير","حتى","لأن","إذ"],"ans":"أ","why":"مواصلة العمل مع اشتداد المرض مخالفة تحتاج استدراكًا: «غير أنه».","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q19","n":19,"stem":"تحتاج اللغة إلى ......... دائم، فهي كائن حي ينمو بالاستعمال ويضمر بالإهمال.","opts":["جمود","تقييد","تدريب","اختصار"],"ans":"ج","why":"التعليل يذكر النمو بالاستعمال، والتدريب هو الاستعمال الدائم. و«جمود» و«تقييد» يناقضان النمو.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q20","n":20,"stem":"لم أجد في المكتبة النسخة المطلوبة، ......... طلبتها عبر الإنترنت.","opts":["فـ","مع أن","بل","كي"],"ans":"أ","why":"الطلب عبر الإنترنت نتيجة مترتبة على عدم الوجود، والفاء للسببية والترتيب.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q21","n":21,"stem":"يُعرف الصديق الصادق في ......... لا في ......... .","opts":["الرخاء – الشدة","السفر – الإقامة","الغنى – الفقر","الشدة – الرخاء"],"ans":"د","why":"الحكمة المشهورة أن الشدائد تكشف معادن الأصدقاء، فالمعرفة تقع وقت الشدة لا وقت الرخاء.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q22","n":22,"stem":"أسهم اختراع الطباعة في ......... المعرفة بين الناس بعد أن كانت حكرًا على قلة.","opts":["حصر","تعميم","تعقيد","تأجيل"],"ans":"ب","why":"قوله «بعد أن كانت حكرًا على قلة» يقتضي الانتقال إلى الشيوع، و«تعميم» ضد «حكر».","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q23","n":23,"stem":"......... حاول إخفاء قلقه ......... أن ارتجاف يديه فضحه.","opts":["لقد – حتى","كي – لأن","مهما – إلا","إذا – بل"],"ans":"ج","why":"تركيب «مهما… إلا أن…» يفيد أن المحاولة لم تُجدِ، والارتجاف كشفه.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q24","n":24,"stem":"لا يُبنى المجد ......... ، وإنما بالعمل الصبور الطويل.","opts":["بالتخطيط","بالتعاون","بالأماني","بالإتقان"],"ans":"ج","why":"المقابلة مع «العمل الصبور» تقتضي نفي ما لا عمل فيه، وهو الأماني. أما التخطيط والتعاون والإتقان فمن أسباب المجد.","skill":"إكمال الجمل","src":"u2"},{"id":"u2-q25","n":25,"stem":"كان النص ......... في ظاهره، ......... في باطنه، فاحتاج إلى شرح طويل.","opts":["واضحًا – واضحًا","صعبًا – صعبًا","طويلًا – قصيرًا","سهلًا – عميقًا"],"ans":"د","why":"المقابلة بين الظاهر والباطن تقتضي اختلافهما، والحاجة إلى شرح طويل تفسّرها العمق في الباطن.","skill":"إكمال الجمل","src":"u2"}],"mistakes":["قراءة نصف الجملة والتوقف عند الفراغ.","إهمال أداة الربط، وهي أصرح قرينة في السؤال.","اختيار الكلمة الأفصح أو الأغرب ظنًّا أن الغريب أقرب إلى الصواب.","في سؤال الفراغين: محاولة حسم الفراغين معًا بدل البدء بالأسهل.","إهمال التركيب: حرف الجر، والإفراد والجمع، والتذكير والتأنيث."]},{"key":"u3","title":"الوحدة الثالثة: الخطأ السياقي","label":"الوحدة الثالثة","skill":"الخطأ السياقي","num":"3","note":"","intro":["تُعرض عليك جملة سليمة في لغتها ونحوها، وفيها كلمة واحدة في غير موضعها من حيث المعنى. والمطلوب تحديد هذه الكلمة.","المفتاح أن الخطأ ليس إملائيًّا ولا نحويًّا. الكلمة المطلوبة كلمة صحيحة في ذاتها، لكنها تناقض اتجاه الجملة أو تفسد الحكمة التي تقوم عليها.","هذا القسم من أسرع أقسام اللفظي حلًّا متى أتقنت طريقته، وأكثرها خسارة متى قرأت الجملة قراءة عجلى."],"shape":{"stem":"الغبيُّ من تكلّم ببطء وفكّر بسرعة.","opts":["الغبي","تكلّم","ببطء","بسرعة"],"note":"المطلوب الكلمة التي لا يتفق مدلولها مع المعنى العام للجملة."},"shapeTitle":"شكل السؤال","table":{"title":"أنماط الخطأ السياقي الأربعة","headers":["النمط","وصفه","مثال"],"rows":[["كلمة بضد المراد","الكلمة تحمل عكس المعنى الذي تقتضيه الجملة","«يُحبّ الناسُ البخيلَ لسخائه» — الصواب: الكريم"],["تناقض منطقي داخلي","شطرا الجملة لا يستقيم اجتماعهما","«اجتهد فرسب» — الصواب: فنجح"],["كلمة لا تلائم الموصوف","الكلمة صحيحة لكنها لا تُقال في هذا الموضع","«ماء عذب النكهة» — الصواب: عذب المذاق"],["حكمة أو مثل مُحرَّف","المثل معروف وقد غُيّرت إحدى كلماته","«الوقت كالسيف إن لم تصنعه صنعك» — الصواب: تقطعه قطعك"]],"note":"أكثر أسئلة هذا القسم من النمطين الأول والثاني."},"levels":null,"strategies":[["حدّد الفكرة العامة للجملة أولًا","اسأل: ماذا تريد الجملة أن تقول؟ مدحًا أم ذمًّا؟ نصيحةً أم تحذيرًا؟ الكلمة التي تخرج عن هذه الفكرة هي الخطأ."],["افحص اتجاه الجملة","ضع علامة (+) على الكلمات ذات المعنى الإيجابي و(−) على السلبية. حين تجد كلمة إشارتها مخالفة لسياقها فهي المطلوبة غالبًا."],["جرّب الاستبدال بالضد","ضع ضد الكلمة المشكوك فيها في موضعها. فإن استقام المعنى واتضح فهي الخطأ، وهذه أسرع طريقة للتأكد."],["انتبه إلى الحِكم والأمثال المشهورة","إذا كانت الجملة مثلًا معروفًا فقارنها بأصلها المحفوظ. وتغيير كلمة واحدة في المثل هو الخطأ المقصود."],["لا تبحث عن خطأ نحوي أو إملائي","الجملة سليمة التركيب دائمًا. من يبحث عن خطأ في الإعراب أو الهمزة يضيّع وقته ويخرج بلا إجابة."],["الكلمة الصحيحة قد تبدو غريبة","غرابة الكلمة ليست دليلًا على خطئها. احكم بالمعنى في السياق لا بمدى ألفتك للكلمة."]],"examples":[{"kind":"single","n":1,"label":"","stem":"الغبيُّ من تكلّم ببطء وفكّر بسرعة.","opts":["الغبي","تكلّم","ببطء","بسرعة"],"steps":["فكرة الجملة: ذمّ صفة من الصفات؛ لأنها بدأت بـ«الغبي».","من يتكلم ببطء فهو متأنٍّ، ومن يفكر بسرعة فهو حاضر البديهة. وهاتان صفتا الذكي لا الغبي.","إذن الخلل في ترتيب الصفتين: الغبي هو من يتكلم بسرعة ويفكر ببطء.","نجرّب الاستبدال بالضد في «ببطء»: «الغبي من تكلّم بسرعة وفكّر ببطء» — استقام المعنى تمامًا."],"ans":"ج","tip":""},{"kind":"single","n":2,"label":"","stem":"الإنسان المتسامح يتصرف بعفوية ويتوقع أن كل من حوله أشرار.","opts":["المتسامح","بعفوية","يتوقع","أشرار"],"steps":["فكرة الجملة: وصف المتسامح، والتسامح صفة إيجابية.","«يتصرف بعفوية» يوافق التسامح. أما «يتوقع أن كل من حوله أشرار» فسوء ظن يناقضه.","الاستبدال بالضد: «يتوقع أن كل من حوله أخيار» — استقام المعنى.","إذن الكلمة الخاطئة «أشرار»."],"ans":"د","tip":""},{"kind":"single","n":3,"label":"","stem":"الوقت كالسيف إن لم تصنعه صنعك.","opts":["الوقت","كالسيف","تصنعه","صنعك"],"steps":["الجملة مثل مشهور، فنقارنها بأصلها.","أصل المثل: «الوقت كالسيف إن لم تقطعه قطعك».","الكلمة المغيّرة هي «تصنعه»، وموضعها في الخيار (ج).","ويؤيده المعنى: السيف يُقطع به ولا يُصنع به."],"ans":"ج","tip":"احفظ المشهور من الأمثال؛ فهي مادة متكررة في هذا القسم."},{"kind":"single","n":4,"label":"","stem":"أثنى المدير على الموظف المهمل لحرصه على إنجاز العمل في وقته.","opts":["أثنى","المهمل","لحرصه","إنجاز"],"steps":["فكرة الجملة: ثناء ومدح، بدليل «أثنى» و«لحرصه».","«المهمل» كلمة ذمّ في سياق كله مدح.","الاستبدال بالضد: «الموظف المجتهد» — استقام المعنى.","إذن الخطأ في «المهمل»."],"ans":"ب","tip":""},{"kind":"single","n":5,"label":"","stem":"كان الطريق وعرًا مليئًا بالحفر، فقطعناه في زمن قياسي دون عناء.","opts":["وعرًا","بالحفر","قياسي","عناء"],"steps":["شطر الجملة الأول يصف طريقًا صعبًا، والثاني يصف عبورًا سهلًا سريعًا. بين الشطرين تناقض.","أيّ الكلمتين الخطأ؟ الخطأ في الشطر الذي يخالف السياق الأصلي، والوصف المفصّل (وعر، مليء بالحفر) هو الفكرة المؤكَّدة.","إذن المخالف هو وصف العبور. والكلمة التي تحمل هذا المعنى «قياسي».","الاستبدال: «فقطعناه في زمن طويل بعناء» — استقام. والخيار (ج) هو الأنسب لأن الفاء تفيد الترتيب على الوعورة."],"ans":"ج","tip":"حين يتناقض شطرا الجملة، فالخطأ في الشطر الأقل تفصيلًا."},{"kind":"single","n":6,"label":"","stem":"لا يُدرك المرء غايته بالتمنّي، وإنما بالسعي والجدّ والكسل.","opts":["يُدرك","بالتمنّي","السعي","الكسل"],"steps":["بنية الجملة: نفي سبب («التمنّي») وإثبات أسباب مقابلة.","الأسباب المثبتة معطوفة: السعي، والجدّ، والكسل.","السعي والجدّ يستقيمان مع بلوغ الغاية، أما الكسل فهو من جنس التمنّي المنفيّ لا من جنس الجدّ.","إذن «الكسل» هي الكلمة الخارجة عن السياق."],"ans":"د","tip":"في المعطوفات، ابحث عن العنصر الذي يخالف إخوته في الاتجاه."}],"exInstruction":"في كل جملة مما يأتي كلمة لا يتفق مدلولها مع المعنى العام للجملة. حدّد هذه الكلمة.","passages":[],"items":[{"id":"u3-q1","n":1,"stem":"المعلم الناجح يشجّع طلابه ويحبطهم كلما أخطؤوا.","opts":["يشجّع","يحبطهم","كلما","أخطؤوا"],"ans":"ب","why":"المعلم الناجح لا يُحبط طلابه؛ الصواب «يشدّ من أزرهم» أو «يقوّمهم».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q2","n":2,"stem":"خير الكلام ما قلّ وكثُر.","opts":["خير","الكلام","قلّ","كثُر"],"ans":"د","why":"أصل المثل «ما قلّ ودلّ»، والجمع بين القلة والكثرة تناقض.","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q3","n":3,"stem":"استعد الطالب للاختبار بجدّ، فكانت نتيجته مخيّبة للآمال ونال المركز الأول.","opts":["مخيّبة","للآمال","نال","الأول"],"ans":"أ","why":"الجدّ ونيل المركز الأول ينفيان الخيبة؛ الصواب «مشرّفة».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q4","n":4,"stem":"الصديق الوفيّ يتخلى عنك في الشدائد ويقف معك وقت الحاجة.","opts":["يتخلى","الشدائد","يقف","الحاجة"],"ans":"أ","why":"الوفاء يقتضي الثبات؛ الصواب «لا يتخلى» أو «يسندك».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q5","n":5,"stem":"كلما ازداد الإنسان علمًا ازداد غرورًا وتواضعًا لمن حوله.","opts":["علمًا","غرورًا","تواضعًا","حوله"],"ans":"ب","why":"الغرور يناقض التواضع المذكور بعده، ويناقض أثر العلم.","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q6","n":6,"stem":"الماء العذب صافي اللون طيّب المذاق كريه الرائحة.","opts":["العذب","صافي","طيّب","كريه"],"ans":"د","why":"الصفات كلها في المدح، فـ«كريه» خارجة عنها؛ الصواب «زكيّ الرائحة».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q7","n":7,"stem":"لا تؤجّل عمل اليوم إلى الغد، فالتسويف مفتاح النجاح.","opts":["تؤجّل","الغد","التسويف","النجاح"],"ans":"د","why":"التسويف مذموم في الجملة، فلا يكون مفتاحًا للنجاح؛ الصواب «مفتاح الفشل».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q8","n":8,"stem":"اشتهر القاضي بعدله ونزاهته وميله إلى أصحاب النفوذ.","opts":["بعدله","نزاهته","ميله","النفوذ"],"ans":"ج","why":"الميل إلى أصحاب النفوذ يناقض العدل والنزاهة.","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q9","n":9,"stem":"الكتاب خير جليس؛ لأنه يثرثر كثيرًا ولا يملّ صاحبه.","opts":["يثرثر","كثيرًا","يملّ","صاحبه"],"ans":"أ","why":"الثرثرة ذمّ في سياق مدح؛ والصواب «لا ينطق بسوء» أو «يفيدك».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q10","n":10,"stem":"قابل الإساءة بالإساءة تكسب قلوب الناس.","opts":["قابل","الإساءة الثانية","تكسب","الناس"],"ans":"ب","why":"كسب القلوب يكون بمقابلة الإساءة بالإحسان لا بالإساءة.","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q11","n":11,"stem":"الرياضة المنتظمة تُقوّي الجسم وتُنشّط الذهن وتُضعف المناعة.","opts":["المنتظمة","تُقوّي","تُنشّط","تُضعف"],"ans":"د","why":"الفوائد كلها في اتجاه واحد، فإضعاف المناعة خارج عنه؛ الصواب «تُقوّي المناعة».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q12","n":12,"stem":"كان الجو ممطرًا غزيرًا، فخرج الناس إلى الحدائق للتنزّه والجلوس على العشب.","opts":["خرج","الحدائق","الجلوس","العشب"],"ans":"أ","why":"المطر الغزير يمنع الخروج للتنزه؛ الصواب «فلزم الناس بيوتهم».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q13","n":13,"stem":"من علامات نضج العقل أن يستمع المرء لرأي مخالفه ويسخر منه.","opts":["نضج","يستمع","مخالفه","يسخر"],"ans":"د","why":"السخرية تناقض نضج العقل والاستماع؛ الصواب «ويحترمه».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q14","n":14,"stem":"الأمّة التي تُهمل تاريخها تبني مستقبلها على أساس متين.","opts":["تُهمل","تاريخها","تبني","متين"],"ans":"د","why":"إهمال التاريخ لا يُنتج أساسًا متينًا؛ الصواب «على غير أساس» أو «هشّ».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q15","n":15,"stem":"تميّز أسلوبه بالإيجاز والوضوح والإطناب الممل.","opts":["تميّز","الوضوح","الإطناب","الممل"],"ans":"ج","why":"الإطناب ضد الإيجاز، فلا يجتمعان في وصف واحد.","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q16","n":16,"stem":"درهم وقاية خير من قنطار علاج، فالإهمال أنفع من الاحتياط.","opts":["خير","الإهمال","أنفع","الاحتياط"],"ans":"ب","why":"صدر الجملة يفضّل الوقاية، فالنتيجة الصحيحة أن الاحتياط أنفع لا الإهمال.","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q17","n":17,"stem":"الشمس منجم من نار، ولكنها تمنح النور؛ فروعة المخلوق فيما يأخذه لا فيما يعطيه.","opts":["منجم","تمنح","يأخذه","يعطيه"],"ans":"ج","why":"العبارة تمدح العطاء بدليل «تمنح النور»؛ الصواب «فيما يعطيه لا فيما يأخذه».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q18","n":18,"stem":"احترم الطلاب معلمهم لقسوته عليهم وعدله بينهم.","opts":["احترم","لقسوته","وعدله","بينهم"],"ans":"ب","why":"القسوة لا تورث الاحترام في سياق يذكر العدل؛ الصواب «لرأفته» أو «لرحمته».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q19","n":19,"stem":"اقتصاد الدولة ينهض بزيادة الإنتاج وترشيد الاستهلاك وكثرة الاستيراد.","opts":["ينهض","ترشيد","كثرة","الاستيراد"],"ans":"ج","why":"كثرة الاستيراد تناقض ترشيد الاستهلاك وزيادة الإنتاج؛ الصواب «تقليل الاستيراد».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q20","n":20,"stem":"لسانك حصانك إن صنته صانك وإن أكرمته أهانك.","opts":["لسانك","صنته","أكرمته","أهانك"],"ans":"ج","why":"أصل المثل «وإن خنته خانك»، والمقابلة تقتضي الضد لا الإكرام.","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q21","n":21,"stem":"المشروع الناجح يحتاج إلى تخطيط دقيق وتنفيذ عشوائي ومتابعة مستمرة.","opts":["دقيق","عشوائي","متابعة","مستمرة"],"ans":"ب","why":"العشوائية تناقض الدقة والاستمرار، وتناقض نجاح المشروع.","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q22","n":22,"stem":"كان النهر جافًّا هذا العام، فغرقت المزارع المجاورة في المياه.","opts":["جافًّا","غرقت","المزارع","المياه"],"ans":"أ","why":"الغرق في المياه يقتضي فيضان النهر لا جفافه؛ الصواب «فائضًا».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q23","n":23,"stem":"إذا أردت أن تُطاع فاسأل الناس ما يعجزون عنه.","opts":["أردت","تُطاع","فاسأل","يعجزون"],"ans":"د","why":"أصل الحكمة «فاسأل ما يُستطاع»؛ فطلب المستحيل يمنع الطاعة.","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q24","n":24,"stem":"تحلّى الطبيب بالصبر على مرضاه والاستماع لشكواهم وتجاهل أسئلتهم.","opts":["الصبر","الاستماع","تجاهل","أسئلتهم"],"ans":"ج","why":"التجاهل يناقض الصبر والاستماع؛ الصواب «الإجابة عن أسئلتهم».","skill":"الخطأ السياقي","src":"u3"},{"id":"u3-q25","n":25,"stem":"القراءة المتأنية توسّع المدارك وتضيّق الأفق وتنمّي الخيال.","opts":["تضيّق","الأفق","تنمّي","الخيال"],"ans":"أ","why":"تضييق الأفق يخالف التوسيع والتنمية؛ الصواب «توسّع الأفق».","skill":"الخطأ السياقي","src":"u3"}],"mistakes":["البحث عن خطأ نحوي أو إملائي، والجملة سليمة في تركيبها دائمًا.","اختيار الكلمة الغريبة لمجرد غرابتها.","قراءة الجملة قراءة عجلى دون تحديد فكرتها العامة.","نسيان أن بعض الجمل أمثال مشهورة يكفي فيها استحضار الأصل.","اختيار كلمة صحيحة في موضعها لأن الطالب لم ينتبه إلى أداة العطف التي تربطها بما قبلها."]},{"key":"u4","title":"الوحدة الرابعة: استيعاب المقروء","label":"الوحدة الرابعة","skill":"استيعاب المقروء","num":"4","note":"","intro":["يُعرض عليك نص قصير أو متوسط الطول، تليه أسئلة تقيس فهمك لمضمونه واستنتاجك منه.","القاعدة الحاكمة: الإجابة في النص لا في معلوماتك. فقد يكون الخيار صحيحًا في الواقع وخاطئًا في السؤال لأن النص لم يذكره.","هذا أصعب أقسام اللفظي، لا لصعوبة أسئلته بل لأنه يستهلك الوقت ويعاقب من يجيب من محصوله الشخصي بدل النص. ولهذا تُحل بقية الأقسام بسرعة لتوفير الوقت له."],"shape":null,"shapeTitle":"أنواع أسئلة الاستيعاب","table":{"title":"أنواع الأسئلة وطريقة التعامل مع كل نوع","headers":["نوع السؤال","صيغته","طريقة الحل"],"rows":[["الفكرة الرئيسة","يدور النص حول… / الفكرة العامة للنص","ابحث عن الفكرة التي يخدمها النص كله، لا فكرة فقرة واحدة"],["العنوان المناسب","أنسب عنوان للنص","العنوان يشمل النص كله ولا يضيق عن بعضه ولا يتسع لما ليس فيه"],["معنى كلمة في السياق","المقصود بكلمة (كذا) في النص","ضع كل خيار مكان الكلمة في الجملة نفسها واختر ما يستقيم"],["مرجع الضمير","يعود الضمير في (كذا) على…","ارجع إلى ما قبل الضمير مباشرة وجرّب الإحلال"],["الاستنتاج","يُفهم من النص أن… / يمكن استنتاج…","الجواب غير مذكور حرفيًّا لكنه يلزم مما ذُكر"],["التفصيل الصريح","ذكر النص أن… / أي مما يأتي صحيح وفق النص","ابحث عن الموضع الحرفي في النص ولا تعتمد على ذاكرتك"],["ما لم يُذكر","كل ما يأتي ذُكر في النص عدا…","تحقق من الخيارات الثلاثة في النص، والباقي هو الجواب"],["هدف الكاتب ونبرته","يهدف الكاتب إلى… / نبرة النص","انظر: هل يشرح؟ يحذّر؟ ينقد؟ يدعو؟ واستدل بألفاظه"]]},"levels":null,"strategies":[["اقرأ الأسئلة قبل النص قراءة سريعة","مرور سريع على الأسئلة يجعل قراءتك للنص موجّهة، فتعرف ما تبحث عنه بدل أن تقرأ ثم تعود للبحث من جديد."],["اقرأ النص كاملًا قراءة واحدة متأنية","لا تقفز بين السطور. القراءة المجزّأة تُفقدك خيط الفكرة، وهي سبب أكثر الأخطاء في أسئلة الفكرة الرئيسة."],["عُد إلى النص في كل سؤال","لا تُجب من الذاكرة. ضع إصبعك على السطر الذي تستند إليه إجابتك؛ فإن لم تجده فإجابتك تخمين."],["احذر الخيار الصحيح في ذاته والخاطئ في السؤال","أشهر فخّ في هذا القسم خيار يوافق معلوماتك العامة ولم يذكره النص. المعيار: هل قاله النص؟"],["انتبه إلى ألفاظ الإطلاق والتقييد","كلمات مثل «دائمًا» و«كل» و«لا يمكن» نادرًا ما تصح، بينما «قد» و«غالبًا» و«بعض» أقرب إلى الصواب. قارنها بلفظ النص نفسه."],["أدِر وقتك بحزم","خصّص وقتًا ثابتًا لكل نص. وإذا استعصى سؤال فضع إجابة مرجّحة وانتقل، ثم عُد إليه إن بقي وقت؛ فبقاؤك على سؤال واحد يضيّع عليك نصًّا كاملًا."]],"examples":[{"kind":"passage","title":"النص الأول (مثال محلول)","text":"لم تكن المكتبة في الحضارة الإسلامية مستودعًا للكتب فحسب، بل كانت مجلسًا للعلم ومقصدًا للباحثين. ففي بيت الحكمة ببغداد اجتمع المترجمون والفلكيون والأطباء، ونُقلت إلى العربية أمهات الكتب اليونانية والفارسية والهندية. ولم يقف الأمر عند النقل، إذ راجع العلماء ما ترجموه ونقدوه وأضافوا إليه، حتى صار كثير من تلك الكتب في صورتها العربية أوفى من أصولها. ولهذا يخطئ من يصف تلك الحركة بأنها نقل خالص؛ فالنقل الذي لا يصحبه نقد لا يُنشئ حضارة.","qs":[{"q":"الفكرة الرئيسة للنص هي:","opts":["وصف بيت الحكمة في بغداد","أن المكتبة الإسلامية كانت مركز إنتاج علمي لا مجرد نقل","أهمية اللغة اليونانية في العلوم","دور الأطباء في الحضارة الإسلامية"],"ans":"ب","steps":["الخيار (أ) يذكر بيت الحكمة، وهو مثال ورد في النص لا فكرته الشاملة.","الخياران (ج) و(د) تفصيلان عابران.","أما (ب) فيجمع طرفي النص: نفي كونها مستودعًا فحسب، ونفي كون الحركة نقلًا خالصًا."]},{"q":"يُفهم من النص أن العلماء المسلمين:","opts":["اكتفوا بترجمة ما وصلهم","رفضوا علوم الأمم الأخرى","لم يأخذوا المترجَم على علّاته بل نقدوه وزادوا عليه","ترجموا الكتب اليونانية وحدها"],"ans":"ج","steps":["(أ) يناقض قوله: «ولم يقف الأمر عند النقل».","(ب) يناقض النص كله، فقد نقلوا عن ثلاث حضارات.","(د) يناقض ذكر الفارسية والهندية.","(ج) هو لازم قوله: «راجع العلماء ما ترجموه ونقدوه وأضافوا إليه»."]},{"q":"المقصود بكلمة «أوفى» في النص:","opts":["أقدم","أكمل","أشهر","أسهل"],"steps":["نضع كل خيار في الجملة: «صارت في صورتها العربية أكمل من أصولها» — يستقيم مع سياق المراجعة والإضافة.","«أقدم» يستحيل؛ فالترجمة لاحقة للأصل. و«أشهر» و«أسهل» لا يخدمهما سياق النقد والزيادة."],"ans":"ب"},{"q":"نبرة الكاتب في الجملة الأخيرة:","opts":["تقرير محايد","تصحيح لتصوّر شائع","دعوة إلى ترجمة الكتب","سرد تاريخي"],"ans":"ب","steps":["قوله «يخطئ من يصف» ردّ صريح على رأي قائم.","إذن هو تصحيح لتصوّر شائع، لا تقرير محايد ولا سرد."]}]},{"kind":"passage","title":"النص الثاني (مثال محلول)","text":"تشير دراسات النوم إلى أن الساعة البيولوجية لدى المراهقين تتأخر نحو ساعتين عنها لدى الأطفال والبالغين، فلا يشعر المراهق بالنعاس إلا في وقت متأخر من الليل. ومع ذلك تبدأ أكثر المدارس يومها مبكرًا، فينام كثير من الطلاب أقل مما يحتاجون إليه. وقد جرّبت بعض المدارس تأخير بدء الدوام ساعة واحدة، فلوحظ تحسّن في التركيز وانخفاض في حالات التأخر الصباحي. غير أن الباحثين ينبّهون إلى أن التأخير وحده لا يكفي إذا ظل الطالب ساهرًا على شاشته حتى الفجر؛ فالمشكلة في مجموع العادات لا في موعد الدوام وحده.","qs":[{"q":"أنسب عنوان للنص:","opts":["أضرار السهر على الشاشات","نوم المراهقين بين الساعة البيولوجية وموعد الدوام","كيف تنام ثماني ساعات؟","تجارب المدارس الحديثة"],"ans":"ب","steps":["(أ) و(د) جزءان من النص لا يشملانه.","(ج) لم يتناوله النص أصلًا.","(ب) يجمع طرفي الموضوع: الساعة البيولوجية وموعد الدوام."]},{"q":"ما النتيجة التي لوحظت بعد تأخير بدء الدوام؟","opts":["ارتفاع درجات الطلاب في جميع المواد","تحسّن التركيز وقلة التأخر الصباحي","انصراف الطلاب عن الشاشات","زيادة عدد ساعات الدراسة"],"ans":"ب","steps":["النص ذكر أمرين بعد التأخير: تحسّن التركيز وانخفاض حالات التأخر.","(أ) زيادة على النص؛ فلم يذكر درجات ولا جميع المواد. وهذا هو فخّ «الصحيح في ذاته».","(ج) يناقض تنبيه الباحثين. و(د) لم يُذكر."]},{"q":"يُفهم من الجملة الأخيرة أن الحل:","opts":["تأخير الدوام فقط","منع استخدام الشاشات نهائيًّا","معالجة عادات النوم إلى جانب موعد الدوام","إلغاء الدوام الصباحي"],"ans":"ج","steps":["قوله «التأخير وحده لا يكفي» ينفي (أ).","وقوله «المشكلة في مجموع العادات» يفيد الجمع بين الأمرين، وهذا (ج).","(ب) و(د) إطلاق لم يقله النص."]},{"q":"الضمير في «يحتاجون إليه» يعود على:","opts":["الباحثين","الطلاب","الأطفال والبالغين","المدارس"],"ans":"ب","steps":["الجملة: «فينام كثير من الطلاب أقل مما يحتاجون إليه».","أقرب مذكور قبل الضمير هو «الطلاب»، ويستقيم به المعنى."]}]}],"exInstruction":"اقرأ كل نص، ثم أجب عن الأسئلة التي تليه وفق ما ورد فيه.","passages":[{"title":"النص الأول","text":"تُعدّ الزراعة المائية من الحلول التي تُطرح لمواجهة شُحّ المياه، وهي زراعة النبات في محلول غنيّ بالعناصر الغذائية بدل التربة. وتوفّر هذه الطريقة قدرًا كبيرًا من الماء؛ لأن المحلول يدور في نظام مغلق فلا يتسرّب إلى باطن الأرض ولا يتبخّر إلا قليلًا. كما تتيح الزراعة داخل المدن وفوق أسطح المباني، فتقصر المسافة بين المزرعة والمستهلك. ولكنها تحتاج إلى طاقة كهربائية دائمة لتشغيل المضخّات، وإلى خبرة في ضبط تركيز المحلول؛ فخطأ بسيط في التركيز قد يُتلف المحصول كله خلال أيام. ولهذا يرى كثير من المختصين أنها مكمّل للزراعة التقليدية لا بديل عنها."},{"title":"النص الثاني","text":"حين انتشرت الصحافة المطبوعة في القرن التاسع عشر، خشي بعض المفكرين أن تصرف الناس عن قراءة الكتب، فالخبر القصير أيسر من الفصل الطويل. ثم تكرّر القلق نفسه مع الإذاعة، ومع التلفاز، ومع الشبكة العنكبوتية. والملاحظ أن الكتاب لم يمت في أيٍّ من هذه الموجات، لكنه تغيّر: تغيّرت موضوعاته وأحجامه وطرائق وصوله إلى القارئ. ولعل الدرس المستفاد أن الوسائط الجديدة لا تقتل القديمة غالبًا، وإنما تدفعها إلى تحديد وظيفتها بدقة أكبر. فالإذاعة لم تُلغِ الصحيفة، لكنها جعلت الصحيفة تتجه إلى التحليل بدل مجرّد نقل الخبر."},{"title":"النص الثالث","text":"يظن كثير من الناس أن النسيان خلل في الذاكرة ينبغي علاجه، والحقّ أنه وظيفة ضرورية. فالدماغ يتلقى في اليوم الواحد سيلًا من التفاصيل التي لا قيمة لأكثرها، ولو حُفظت كلها لازدحمت الذاكرة بما يعوق استرجاع المهم. ولذلك يُرجّح الباحثون أن النسيان عملية انتقاء نشطة لا مجرّد تلاشٍ سلبيّ للأثر. ويؤيد ذلك أن من يعانون فرط تذكّر تفاصيل حياتهم يصفون حالتهم بالعبء لا بالنعمة؛ إذ تلاحقهم الذكريات الدقيقة فتصعب عليهم الموازنة بين ما مضى وما هو قائم. على أن هذا لا يعني إهمال تدريب الذاكرة، فالمطلوب انتقاء واعٍ لا استسلام للنسيان."},{"title":"النص الرابع","text":"لم يكن سوق المدينة القديمة مكانًا للبيع والشراء فحسب، بل كان شبكة اجتماعية كاملة. فالتاجر يعرف زبائنه بأسمائهم، ويعرف ظروفهم، فيؤجّل الدَّين لمن أصابته ضائقة، ويشهد له في المحكمة إن احتاج إلى شاهد. وكانت الأسعار تُعرف بالعرف أكثر مما تُعلن بالأرقام، فيحكمها ما اعتاده الناس لا ما يقرره بائع منفرد. ومع اتساع المدن وتعدّد الأسواق تراجع هذا النمط، وحلّت محله علاقة أسرع وأكثر حيادًا: يدفع المشتري ويمضي دون أن يعرف البائع أو يعرفه. وليس في هذا التحوّل مدح ولا ذمّ بإطلاق؛ فقد خسرت المعاملة دفأها وكسبت المدينة سعة لم تكن ممكنة بالنمط القديم."},{"title":"النص الخامس","text":"يتداول كثيرون نصيحة مفادها أن على الطالب أن يذاكر في مكان واحد ثابت حتى يتعوّد الذهن عليه. وقد أظهرت تجارب في علم النفس المعرفي نتيجة مخالفة: فالمجموعة التي درست المادة نفسها في غرفتين مختلفتين تذكّرت في الاختبار أكثر من المجموعة التي لزمت غرفة واحدة. ويفسّر الباحثون ذلك بأن تنوّع المكان يربط المعلومة بأكثر من إشارة في الذاكرة، فتتعدّد الطرق المؤدية إليها عند الاسترجاع. غير أن هذه النتيجة لا تعني أن أي مكان يصلح؛ فالمكان الصاخب يُفقد التركيز مهما تنوّع، والمقصود تنويع الأماكن الهادئة لا الانتقال إلى الفوضى."}],"items":[{"id":"u4-q1","n":1,"stem":"الفكرة الرئيسة للنص:","opts":["عرض متوازن لمزايا الزراعة المائية وقيودها","فوائد الزراعة فوق الأسطح","خطر شُحّ المياه في العالم","طرق ضبط المحلول الغذائي"],"ans":"أ","why":"النص يعرض المزايا (توفير الماء، الزراعة داخل المدن) ثم القيود (الكهرباء، الخبرة)، وينتهي بحكم متوازن. وبقية الخيارات تفاصيل جزئية.","skill":"استيعاب المقروء","src":"u4","p":0},{"id":"u4-q2","n":2,"stem":"سبب توفير الزراعة المائية للماء أن:","opts":["النبات يحتاج ماء أقل بطبيعته","المحلول يدور في نظام مغلق","الزراعة تتم ليلًا","التربة تحتفظ بالماء"],"ans":"ب","why":"النص علّل التوفير صراحة بدوران المحلول في نظام مغلق يمنع التسرب ويقلّل التبخّر.","skill":"استيعاب المقروء","src":"u4","p":0},{"id":"u4-q3","n":3,"stem":"المقصود بكلمة «شُحّ» في النص:","opts":["وفرة","تلوّث","نُدرة","ملوحة"],"ans":"ج","why":"السياق يتحدث عن مواجهة نقص المياه، والشُحّ هو القِلّة والنُّدرة.","skill":"استيعاب المقروء","src":"u4","p":0},{"id":"u4-q4","n":4,"stem":"كل ما يأتي ذكره النص عن الزراعة المائية عدا:","opts":["حاجتها إلى كهرباء دائمة","إمكان ممارستها فوق الأسطح","حساسيتها لخطأ التركيز","أن محصولها أغلى ثمنًا"],"ans":"د","why":"النص لم يتطرق إلى أسعار المحصول إطلاقًا، وذكر الخيارات الثلاثة الأخرى صراحة.","skill":"استيعاب المقروء","src":"u4","p":0},{"id":"u4-q5","n":5,"stem":"يُفهم من الجملة الأخيرة أن المختصين:","opts":["يرفضون الزراعة المائية","يرون الجمع بينها وبين الزراعة التقليدية","يرون أنها ستحل محل الزراعة التقليدية","يشكّون في توفيرها للماء"],"ans":"ب","why":"قوله «مكمّل… لا بديل» يفيد الجمع بين الطريقتين، لا الرفض ولا الإحلال.","skill":"استيعاب المقروء","src":"u4","p":0},{"id":"u4-q6","n":6,"stem":"يدور النص حول:","opts":["تاريخ الصحافة المطبوعة","أفضلية الكتاب على الإذاعة","خطر الإنترنت على القراءة","أن الوسائط الجديدة تعيد تشكيل القديمة لا تُنهيها"],"ans":"د","why":"النص يستعرض موجات القلق المتكررة ثم يخلص إلى أن الوسيط القديم يتغيّر ولا يموت، وهذا نص الجملة قبل الأخيرة.","skill":"استيعاب المقروء","src":"u4","p":1},{"id":"u4-q7","n":7,"stem":"المثال الذي ساقه الكاتب لتأكيد فكرته:","opts":["تحوّل الصحيفة إلى التحليل بعد ظهور الإذاعة","ازدياد مبيعات الكتب","اختفاء الإذاعة بعد التلفاز","انتشار المكتبات العامة"],"ans":"أ","why":"الجملة الأخيرة تذكر هذا المثال صراحة لبيان كيف حدّدت الصحيفة وظيفتها.","skill":"استيعاب المقروء","src":"u4","p":1},{"id":"u4-q8","n":8,"stem":"يُفهم من النص أن قلق المفكرين:","opts":["تكرّر مع كل وسيط جديد","كان مقصورًا على الصحافة","ثبتت صحته مع الإنترنت","لم يُعبَّر عنه علنًا"],"ans":"أ","why":"النص عدّد: الصحافة ثم الإذاعة ثم التلفاز ثم الشبكة، ووصفه بأنه «القلق نفسه».","skill":"استيعاب المقروء","src":"u4","p":1},{"id":"u4-q9","n":9,"stem":"المقصود بـ«الموجات» في النص:","opts":["اضطرابات البحر","الترددات الإذاعية","مراحل ظهور الوسائط الجديدة","حملات الدعاية"],"ans":"ج","why":"السياق يتحدث عن تعاقب وسائط جديدة، فالموجات هنا مجاز عن هذه المراحل المتعاقبة.","skill":"استيعاب المقروء","src":"u4","p":1},{"id":"u4-q10","n":10,"stem":"موقف الكاتب من مستقبل الكتاب:","opts":["متشائم","محايد لا رأي له","مطمئن مع إقرار بالتغيّر","رافض للوسائط الجديدة"],"ans":"ج","why":"قوله «لم يمت… لكنه تغيّر» يجمع بين الاطمئنان والإقرار بالتحوّل، وليس فيه تشاؤم ولا رفض.","skill":"استيعاب المقروء","src":"u4","p":1},{"id":"u4-q11","n":11,"stem":"الفكرة الرئيسة للنص:","opts":["طرق تقوية الذاكرة","أن النسيان وظيفة نافعة لا خلل","أضرار فرط التذكّر","كيف يعمل الدماغ؟"],"ans":"ب","why":"النص يبدأ بنفي الظنّ الشائع ويقرّر أن النسيان «وظيفة ضرورية»، وكل ما بعده أدلة على ذلك.","skill":"استيعاب المقروء","src":"u4","p":2},{"id":"u4-q12","n":12,"stem":"استدلّ الكاتب على رأيه بـ:","opts":["حال من يعانون فرط تذكّر تفاصيل حياتهم","تجارب مخبرية على الحيوان","إحصاءات عن الطلاب","أقوال الفلاسفة"],"ans":"أ","why":"الدليل الوحيد المذكور هو وصف هؤلاء لحالهم بالعبء لا بالنعمة.","skill":"استيعاب المقروء","src":"u4","p":2},{"id":"u4-q13","n":13,"stem":"المقصود بـ«تلاشٍ سلبيّ للأثر»:","opts":["محو متعمّد للذكريات","تقوية الذكرى بالتكرار","زوال تلقائي للمعلومة دون فعل من الدماغ","نقل الذكرى إلى ذاكرة بعيدة المدى"],"ans":"ج","why":"النص يقابله بـ«عملية انتقاء نشطة»، فالمقابلة تبيّن أن المقصود الزوال التلقائي بلا فعل نشط.","skill":"استيعاب المقروء","src":"u4","p":2},{"id":"u4-q14","n":14,"stem":"يُفهم من الجملة الأخيرة أن الكاتب:","opts":["يوازن بين قبول النسيان وتدريب الذاكرة","يرى أن النسيان كله نافع في كل حال","يدعو إلى ترك تدريب الذاكرة","يتراجع عن رأيه السابق"],"ans":"أ","why":"قوله «لا يعني إهمال تدريب الذاكرة… انتقاء واعٍ لا استسلام» موازنة لا تراجع ولا إطلاق.","skill":"استيعاب المقروء","src":"u4","p":2},{"id":"u4-q15","n":15,"stem":"سبب حاجة الدماغ إلى النسيان وفق النص:","opts":["ضعف خلايا الذاكرة مع العمر","قلة النوم","ازدحام الذاكرة بما يعوق استرجاع المهم","كثرة استعمال الأجهزة"],"ans":"ج","why":"النص علّل ذلك صراحة بأن حفظ كل التفاصيل يزدحم بالذاكرة فيعوق استرجاع المهم.","skill":"استيعاب المقروء","src":"u4","p":2},{"id":"u4-q16","n":16,"stem":"أنسب عنوان للنص:","opts":["تاريخ الأسواق العربية","مشكلات المدن الكبرى","كيف تُحدَّد الأسعار؟","من سوق المعرفة إلى سوق العَجَلة"],"ans":"د","why":"العنوان يلخّص محور النص: الانتقال من سوق قائم على المعرفة الشخصية إلى سوق سريع محايد. وبقية العناوين أضيق أو أوسع من النص.","skill":"استيعاب المقروء","src":"u4","p":3},{"id":"u4-q17","n":17,"stem":"ما الذي كان يحكم الأسعار في السوق القديم؟","opts":["قرار من الوالي","عُرف الناس","قائمة معلنة","المنافسة بين الأسواق"],"ans":"ب","why":"النص: «تُعرف بالعرف أكثر مما تُعلن بالأرقام، فيحكمها ما اعتاده الناس».","skill":"استيعاب المقروء","src":"u4","p":3},{"id":"u4-q18","n":18,"stem":"موقف الكاتب من التحوّل الذي وصفه:","opts":["يذمّه ويدعو إلى العودة للقديم","يرى فيه ربحًا وخسارة معًا","يمدحه مدحًا خالصًا","لا يذكر له أي أثر"],"ans":"ب","why":"الجملة الأخيرة صريحة: «خسرت المعاملة دفأها وكسبت المدينة سعة»، وقد نفى المدح والذم بإطلاق.","skill":"استيعاب المقروء","src":"u4","p":3},{"id":"u4-q19","n":19,"stem":"المقصود بـ«ضائقة» في النص:","opts":["سفر طويل","خصومة","مرض مزمن","عُسر مالي"],"ans":"د","why":"وردت في سياق تأجيل الدَّين، وهو ما يكون لمن ضاقت به الحال ماليًّا.","skill":"استيعاب المقروء","src":"u4","p":3},{"id":"u4-q20","n":20,"stem":"يُفهم من النص أن سبب تراجع النمط القديم:","opts":["اتساع المدن وتعدّد الأسواق","تدخّل الدولة في الأسعار","ارتفاع الأسعار","عزوف الناس عن الشراء"],"ans":"أ","why":"النص ربط التراجع صراحة باتساع المدن وتعدّد الأسواق، ولم يذكر السببين الآخرين.","skill":"استيعاب المقروء","src":"u4","p":3},{"id":"u4-q21","n":21,"stem":"يدور النص حول:","opts":["أهمية الهدوء في المذاكرة","أثر تنويع مكان المذاكرة في التذكّر","طرق تنظيم الوقت","الفرق بين الحفظ والفهم"],"ans":"ب","why":"محور النص تجربة تقارن بين المذاكرة في مكان واحد وفي مكانين، ونتيجتها في الاسترجاع.","skill":"استيعاب المقروء","src":"u4","p":4},{"id":"u4-q22","n":22,"stem":"نتيجة التجربة المذكورة أن المجموعة التي درست في غرفتين:","opts":["تعبت أكثر","تذكّرت أقل","لم يظهر فرق بينها وبين الأخرى","تذكّرت أكثر"],"ans":"د","why":"النص: «تذكّرت في الاختبار أكثر من المجموعة التي لزمت غرفة واحدة».","skill":"استيعاب المقروء","src":"u4","p":4},{"id":"u4-q23","n":23,"stem":"تفسير الباحثين لهذه النتيجة أن تنوّع المكان:","opts":["يربط المعلومة بأكثر من إشارة في الذاكرة","يزيد مدة المذاكرة","يقلّل التوتر","يحسّن النوم"],"ans":"أ","why":"هذا نصّ التفسير الوارد في النص، وما عداه لم يُذكر.","skill":"استيعاب المقروء","src":"u4","p":4},{"id":"u4-q24","n":24,"stem":"الغرض من الجملة الأخيرة:","opts":["نقض نتيجة التجربة","الدعوة إلى المذاكرة في الأماكن العامة","تقييد النتيجة بشرط الهدوء","بيان أن التجربة قديمة"],"ans":"ج","why":"الجملة تضع قيدًا: التنويع بين الأماكن الهادئة، لا الانتقال إلى الصخب. وهذا تقييد لا نقض.","skill":"استيعاب المقروء","src":"u4","p":4},{"id":"u4-q25","n":25,"stem":"يُفهم من النص أن النصيحة الشائعة بالمذاكرة في مكان ثابت:","opts":["أثبتت التجارب صحتها","تخصّ الاختبارات الشفوية","لا يتداولها أحد","خالفتها نتائج التجارب"],"ans":"د","why":"النص افتتح بذكر النصيحة الشائعة ثم قال: «أظهرت تجارب… نتيجة مخالفة».","skill":"استيعاب المقروء","src":"u4","p":4}],"mistakes":["الإجابة من المعلومات العامة لا من النص.","اختيار خيار فيه لفظ من ألفاظ النص دون تحقّق من معناه.","قبول الخيارات المطلقة مثل «دائمًا» و«جميع» و«لا يمكن».","الخلط بين الفكرة الرئيسة وفكرة إحدى الفقرات.","الإطالة في نص واحد حتى يضيع وقت النص الذي يليه."]},{"key":"u5","title":"الوحدة الخامسة: الارتباط والاختلاف (المفردة الشاذة)","label":"الوحدة الخامسة","skill":"الارتباط والاختلاف","num":"5","note":"تنبيه مهم: هذه المهارة تَرِد في الاختبار الورقي وفي النماذج السابقة، ولا تظهر عادة في الاختبار المحوسب الذي يقتصر قسمه اللفظي على أربع مهارات. فإن كان اختبارك محوسبًا فاجعل هذه الوحدة مراجعة خفيفة، وإن كان ورقيًّا فأتقنها كبقية الوحدات.","intro":["تقيس هذه المهارة قدرتك على إدراك العلاقة التي تجمع بين عدة كلمات أو عبارات، وتمييز الخارج عنها.","الفكرة الجوهرية: لا تبحث عن الكلمة «الغريبة» عن ذوقك، بل عن الرابط الذي يجمع ثلاثًا ويستثني واحدة."],"shape":null,"shapeTitle":"شكل السؤال","table":{"title":"صور السؤال الثلاث","headers":["الصورة","المطلوب","مثال"],"rows":[["المفردة الشاذة","أربع كلمات تجمع ثلاثًا منها علاقة واحدة، والمطلوب المختلفة","(تفاح — برتقال — جزر — موز) الشاذة: جزر، لأنه خضار"],["الكلمة المرتبطة","كلمة في رأس السؤال، والمطلوب ما يرتبط بها من الخيارات","«قلم» ← (حبر) لأنه مادته"],["الكلمة الزائدة","جملة فيها كلمة زائدة لا يحتاجها المعنى، والمطلوب تحديدها","«عاد الغائب راجعًا إلى بيته» الزائدة: راجعًا"]]},"levels":{"title":"مستويات التصنيف التي يُبنى عليها الرابط","headers":["المستوى","اسأل نفسك","مثال"],"rows":[["النوع والجنس","هل الثلاثة من فصيلة واحدة؟","أسد، نمر، فهد / حمامة"],["الوظيفة","هل تُستعمل في الغرض نفسه؟","مقص، سكين، منشار / مسطرة"],["الصيغة الصرفية","هل هي على وزن واحد؟","كاتب، قارئ، لاعب / مكتوب"],["المصدر أو الأصل","هل تأتي من المصدر نفسه؟","حليب، جبن، زبدة / عسل"],["الطبيعة","حيّ أم جماد؟ طبيعي أم مصنوع؟","ذهب، فضة، حديد / خشب"],["الاتجاه أو القيمة","مدح أم ذمّ؟ زيادة أم نقصان؟","كرم، سخاء، جود / بخل"],["المجال","هل تنتمي إلى الحقل نفسه؟","قلب، كبد، رئة / عظم"]],"note":"إذا لم تجد الرابط في مستوى فانتقل إلى المستوى الذي يليه؛ فأكثر أخطاء هذا القسم سببها التوقف عند أول مستوى."},"strategies":[["ابحث عن الرابط بين ثلاث كلمات لا عن الشاذة مباشرة","اسأل: ما الذي تشترك فيه ثلاث من هذه الكلمات؟ متى وجدت الرابط ظهرت الشاذة تلقائيًّا. البحث المباشر عن «الغريبة» يقودك إلى الحدس لا إلى الدليل."],["جرّب أكثر من مستوى تصنيف","قد تكون الكلمات كلها أسماء حيوانات، فالرابط إذن ليس النوع بل شيء أدق: الأليف والمفترس، أو ما يطير وما لا يطير."],["احذر الشذوذ المزدوج","إذا وجدت أن كل كلمة يمكن أن تكون شاذة بمستوى ما، فاختر المستوى الذي تشترك فيه ثلاث كلمات اشتراكًا واضحًا لا متكلّفًا."],["في «الكلمة المرتبطة»: صُغ العلاقة كما في التناظر","حدّد نوع الارتباط المطلوب: مادة، أو أداة، أو مكان، أو صفة ملازمة. ثم اختر الخيار الذي يحقق هذا الارتباط بأوضح صورة."],["في «الكلمة الزائدة»: احذف الكلمة واقرأ الجملة","إن استقام المعنى كاملًا بعد حذفها فهي الزائدة. والزيادة غالبًا تكرار لمعنى موجود في الجملة (تحصيل حاصل)."]],"examples":[{"kind":"single","n":1,"label":"المفردة الشاذة","stem":"أي الكلمات الآتية لا تنتمي إلى المجموعة؟","opts":["مثلث","مربع","دائرة","مستطيل"],"steps":["المستوى الأول: كلها أشكال هندسية، فالرابط ليس هنا.","المستوى الثاني: عدد الأضلاع. المثلث ثلاثة، والمربع أربعة، والمستطيل أربعة.","الدائرة لا أضلاع لها ولا زوايا.","إذن الرابط: أشكال ذات أضلاع مستقيمة، والشاذة: دائرة."],"ans":"ج","tip":""},{"kind":"single","n":2,"label":"المفردة الشاذة","stem":"أي الكلمات الآتية لا تنتمي إلى المجموعة؟","opts":["ذهب","فضة","خشب","نحاس"],"steps":["المستوى الأول: كلها مواد. الرابط غير كافٍ.","المستوى الثاني: الطبيعة. الذهب والفضة والنحاس معادن، والخشب مادة نباتية.","الشاذة: خشب."],"ans":"ج","tip":""},{"kind":"single","n":3,"label":"المفردة الشاذة","stem":"أي الكلمات الآتية لا تنتمي إلى المجموعة؟","opts":["كاتب","قارئ","مكتوب","لاعب"],"steps":["المعاني متفرقة، فجرّب مستوى الصيغة الصرفية.","كاتب وقارئ ولاعب على وزن «فاعل»، وهي اسم فاعل تدل على من قام بالفعل.","«مكتوب» على وزن «مفعول»، وهي اسم مفعول تدل على من وقع عليه الفعل.","الشاذة: مكتوب."],"ans":"ج","tip":"إذا لم يجمع الكلمات معنًى فانظر في وزنها الصرفي."},{"kind":"single","n":4,"label":"الكلمة المرتبطة","stem":"ما الكلمة التي ترتبط بكلمة «ساعة»؟","opts":["مفتاح","عقرب","نافذة","حقيبة"],"steps":["المطلوب علاقة ارتباط واضحة: جزء، أو أداة، أو مكان.","المفتاح يرتبط بالباب، والنافذة والحقيبة لا صلة لهما بالساعة.","«عقرب» جزء أساسي من الساعة تُقرأ به."],"ans":"ب","tip":""},{"kind":"single","n":5,"label":"الكلمة الزائدة","stem":"حدّد الكلمة الزائدة: «رجع المسافر عائدًا إلى وطنه بعد غياب طويل».","opts":["رجع","عائدًا","وطنه","طويل"],"steps":["احذف «عائدًا» واقرأ: «رجع المسافر إلى وطنه بعد غياب طويل» — المعنى تام.","«عائدًا» تكرار لمعنى «رجع»، فهي تحصيل حاصل.","أما «وطنه» و«طويل» فحذفهما ينقص المعنى."],"ans":"ب","tip":""},{"kind":"single","n":6,"label":"المفردة الشاذة","stem":"أي الكلمات الآتية لا تنتمي إلى المجموعة؟","opts":["نعامة","بطريق","صقر","دجاجة"],"steps":["المستوى الأول: كلها طيور، فالرابط أدق من ذلك.","المستوى الثاني: القدرة على الطيران. النعامة والبطريق والدجاجة لا تطير طيرانًا حقيقيًّا.","الصقر طائر جارح قوي الطيران.","الشاذة: صقر."],"ans":"ج","tip":"حين تكون الكلمات كلها من جنس واحد، فالرابط في صفة تجمع ثلاثًا منها."}],"exInstruction":"أجب عن الأسئلة الآتية. من (1) إلى (14) حدّد الكلمة الشاذة، ومن (15) إلى (18) حدّد الكلمة المرتبطة، ومن (19) إلى (22) حدّد الكلمة الزائدة في الجملة.","passages":[],"items":[{"id":"u5-q1","n":1,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["سيارة","طائرة","قطار","دراجة"],"ans":"ب","why":"الثلاثة الأولى وسائل نقل برّية، والطائرة جوّية.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q2","n":2,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["كبد","رئة","عظم","قلب"],"ans":"ج","why":"الثلاثة الأولى أعضاء داخلية رخوة، والعظم نسيج صلب من الهيكل.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q3","n":3,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["جبن","كرم","شجاعة","أمانة"],"ans":"أ","why":"الثلاثة الأولى فضائل، والجبن رذيلة.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q4","n":4,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["حليب","جبن","زبدة","عسل"],"ans":"د","why":"الثلاثة الأولى منتجات ألبان، والعسل تنتجه النحل.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q5","n":5,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["نهر","بحيرة","جبل","بحر"],"ans":"ج","why":"الثلاثة الأولى مسطّحات مائية، والجبل تضاريس يابسة.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q6","n":6,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["مسمار","منشار","مطرقة","مفك"],"ans":"أ","why":"الثلاثة الأولى أدوات يُعمل بها، والمسمار قطعة يُعمل عليها.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q7","n":7,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["أحمر","أزرق","طويل","أصفر"],"ans":"ج","why":"الثلاثة الأولى ألوان على وزن «أفعل»، و«طويل» صفة قياس على وزن «فعيل».","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q8","n":8,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["قمح","شعير","تفاح","أرز"],"ans":"ج","why":"الثلاثة الأولى حبوب، والتفاح فاكهة.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q9","n":9,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["مدرسة","جامعة","معهد","مستشفى"],"ans":"د","why":"الثلاثة الأولى مؤسسات تعليمية، والمستشفى مؤسسة علاجية.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q10","n":10,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["ذكاء","بصر","شمّ","سمع"],"ans":"أ","why":"الثلاثة الأولى حواسّ، والذكاء قدرة عقلية.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q11","n":11,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["خشب","حدّاد","خبّاز","نجّار"],"ans":"أ","why":"الثلاثة الأولى أصحاب مهن على وزن «فعّال»، والخشب مادة.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q12","n":12,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["سبت","رمضان","اثنين","أحد"],"ans":"ب","why":"الثلاثة الأولى أيام الأسبوع، ورمضان شهر.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q13","n":13,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["جمل","حصان","غزال","حوت"],"ans":"د","why":"الثلاثة الأولى ثدييات برّية، والحوت ثديي بحري.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q14","n":14,"stem":"أي الكلمات لا تنتمي إلى المجموعة؟","opts":["مكتوب","مقروء","كاتب","مسموع"],"ans":"ج","why":"الثلاثة الأولى اسم مفعول على وزن «مفعول»، و«كاتب» اسم فاعل.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q15","n":15,"stem":"ما الكلمة التي ترتبط بكلمة «كتاب»؟","opts":["صفحة","نافذة","ملعقة","إطار"],"ans":"أ","why":"الصفحة جزء من الكتاب، وبقية الخيارات لا صلة لها به.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q16","n":16,"stem":"ما الكلمة التي ترتبط بكلمة «مطر»؟","opts":["سحاب","رمل","زجاج","معدن"],"ans":"أ","why":"السحاب مصدر المطر، فالارتباط بينهما ارتباط سبب.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q17","n":17,"stem":"ما الكلمة التي ترتبط بكلمة «قاضٍ»؟","opts":["مرسم","حكم","حصاد","مرفأ"],"ans":"ب","why":"الحكم هو عمل القاضي ووظيفته.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q18","n":18,"stem":"ما الكلمة التي ترتبط بكلمة «إبرة»؟","opts":["رمل","ورق","زيت","خيط"],"ans":"د","why":"الخيط ملازم للإبرة في عملها، فلا تُستعمل إبرة الخياطة بدونه.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q19","n":19,"stem":"حدّد الكلمة الزائدة: «صعد الطالب إلى أعلى السلّم بسرعة».","opts":["صعد","أعلى","السلّم","بسرعة"],"ans":"ب","why":"«صعد» تتضمن معنى الاتجاه إلى أعلى، فذكر «أعلى» تكرار.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q20","n":20,"stem":"حدّد الكلمة الزائدة: «تكلم المحاضر بصوته المسموع أمام الحاضرين».","opts":["تكلم","المسموع","أمام","الحاضرين"],"ans":"ب","why":"الكلام لا يكون إلا بصوت مسموع، فالوصف تحصيل حاصل.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q21","n":21,"stem":"حدّد الكلمة الزائدة: «كتب الطالب الواجب بخط يده الخاص به».","opts":["كتب","بخط","يده","الخاص"],"ans":"د","why":"«بخط يده» تفيد الخصوصية أصلًا، فذكر «الخاص به» تكرار.","skill":"الارتباط والاختلاف","src":"u5"},{"id":"u5-q22","n":22,"stem":"حدّد الكلمة الزائدة: «اجتمع القوم معًا في قاعة واحدة».","opts":["اجتمع","معًا","قاعة","واحدة"],"ans":"ب","why":"الاجتماع لا يكون إلا مع غير، فـ«معًا» مكرّرة لمعنى الفعل.","skill":"الارتباط والاختلاف","src":"u5"}],"mistakes":["البحث عن الكلمة الغريبة بالحدس بدل استخراج الرابط بين ثلاث كلمات.","التوقف عند أول مستوى تصنيف دون تجربة المستويات الأدق.","إهمال المستوى الصرفي حين لا يجمع الكلمات معنًى مشترك.","في الكلمة الزائدة: اختيار كلمة يختل المعنى بحذفها."]}],"intro":{"title":"المقدمة: تعرّف على الاختبار","sections":[{"h":"ما اختبار القدرات العامة؟","paras":["اختبار يقيس القدرات التحليلية والاستدلالية لدى خريجي الثانوية المتقدمين للجامعات، ويشرف عليه المركز الوطني للقياس التابع لهيئة تقويم التعليم والتدريب.","هو لا يقيس حفظك للمناهج الدراسية، ولهذا لا يُذاكر كما تُذاكر مادة دراسية. المطلوب أن تُتقن طريقة حل كل نوع من الأسئلة، ثم تكرّرها على أسئلة حقيقية حتى تصير عادة.","وليس في هذا الاختبار نجاح ولا رسوب؛ فدرجتك تبيّن موقعك بين سائر المختبرين، والجهة التي تتقدم إليها هي التي تحدّد الدرجة التي تحتاجها ضمن نسبتها الموزونة."]},{"h":"الفرق بين الورقي والمحوسب","table":{"headers":["وجه المقارنة","الاختبار الورقي","الاختبار المحوسب"],"rows":[["عدد الأسئلة","120 سؤالًا","96 سؤالًا"],["عدد الأقسام","خمسة أقسام","أربعة أقسام"],["أسئلة كل قسم","24 سؤالًا","24 سؤالًا"],["زمن كل قسم","25 دقيقة","25 دقيقة"],["الزمن الكلي","125 دقيقة","100 دقيقة"],["مهارات اللفظي","خمس مهارات، منها الارتباط والاختلاف","أربع مهارات، بلا ارتباط واختلاف"]]},"paras":["لا يمكنك العودة إلى قسم أغلقته، فأنهِ أسئلة القسم قبل الانتقال إلى ما بعده.","التفاصيل التشغيلية قد تتغيّر من موسم إلى آخر، فراجع صفحة الاختبار في موقع قياس قبل موعدك."]},{"h":"وزن القسم اللفظي","paras":["يُقدَّم الاختبار بنوعين بحسب مسارك في الثانوية: العلمي والنظري (الأدبي).","في اختبار العلمي يشكّل القسم اللفظي نحو 55% من الأسئلة، وفي اختبار النظري نحو 75%. أي أن اللفظي في المسار النظري يقارب ثلاثة أرباع درجتك.","وفي الحالين، الاستثمار في القسم اللفظي أعلى عائدًا من أي جزء آخر؛ لأن مهاراته قابلة للإتقان بالتدريب في وقت قصير."]},{"h":"أين تُكسب درجة اللفظي وأين تُخسر","bullets":["الوقت يُكسب في التناظر والخطأ السياقي، ويُخسر في استيعاب المقروء. فأتقن السريع لتمنح نفسك ترف القراءة المتأنية.","في كل مهارة يضع واضع الاختبار خيارًا جذّابًا يبدو صحيحًا للوهلة الأولى. الطريقة المكتوبة هي ما يحميك منه لا حدسك اللغوي.","الثروة اللغوية تساعد ولا تكفي. من يعرف كل الكلمات ويصوغ العلاقة بشكل فضفاض سيخطئ.","التخمين بعد استبعاد الخيارات غير المحتملة أفضل من ترك السؤال فارغًا."]},{"h":"كيف تستخدم هذه الملزمة","numbered":["اقرأ شرح المهارة واستراتيجياتها قراءة واحدة متأنية، ولا تنتقل إلى التدريبات قبل أن تفهم «الطريقة».","ادرس الأمثلة المحلولة بقلم في يدك: غطِّ الحل وحاول أن تصل إلى الجواب بنفسك، ثم قارن خطواتك بالخطوات المكتوبة.","حلّ التدريبات كاملة دون النظر إلى المفتاح، وضع علامة على كل سؤال ترددت فيه ولو أصبت.","صحّح، ثم اقرأ شرح كل سؤال أخطأت فيه أو ترددت فيه، وسجّله في «سجل أخطائي» (الملحق د).","أعد حل الأسئلة التي أخطأت فيها بعد ثلاثة أيام. الإعادة بعد فاصل زمني أثبت أثرًا من الإعادة الفورية.","بعد إتقان المهارات الخمس، اجلس للاختبار التجريبي (الملحق أ) بوقته كاملًا ودون توقف."]},{"h":"خطة مذاكرة مقترحة لأربعة أسابيع","table":{"headers":["الأسبوع","المحتوى","التدريب اليومي"],"rows":[["الأول","التناظر اللفظي + إكمال الجمل","30 دقيقة يوميًّا، ومراجعة الأخطاء في اليوم التالي"],["الثاني","الخطأ السياقي + الارتباط والاختلاف","30 دقيقة يوميًّا مع مراجعة الأسبوع الأول مرتين"],["الثالث","استيعاب المقروء","نصّان يوميًّا بوقت محدد لكل نص"],["الرابع","مراجعة شاملة ومحاكاة","قسم كامل بوقت القاعة (24 سؤالًا / 25 دقيقة) كل يومين"]]},"paras":["الترتيب مهم: المحاكاة قبل إتقان المهارات تقيس ضعفك ولا تعالجه."]}]},"mock":{"title":"ملحق (أ): اختبار تجريبي شامل","instructions":["عدد الأسئلة: 24 سؤالًا. الزمن: 25 دقيقة.","اجلس في مكان هادئ، واضبط مؤقّتًا، ولا توقفه لأي سبب.","لا تترك سؤالًا بلا إجابة؛ خمّن بعد استبعاد ما لا يُحتمل.","صحّح بعد انتهاء الوقت من مفتاح الإجابات في آخر الملحق."],"items":[{"id":"mock-q1","n":1,"stem":"سفينة : ميناء","opts":["دراجة : عجلة","سيارة : وقود","طائرة : سحاب","قطار : محطة"],"ans":"د","why":"الوسيلة ومكان رسوّها ووقوفها.","skill":"التناظر اللفظي","src":"mock"},{"id":"mock-q2","n":2,"stem":"ظمأ : ارتواء","opts":["نوم : تعب","فرح : ضحك","مرض : شفاء","جهل : سؤال"],"ans":"ج","why":"حالة وزوالها: الظمأ يزول بالارتواء، والمرض يزول بالشفاء.","skill":"التناظر اللفظي","src":"mock"},{"id":"mock-q3","n":3,"stem":"قمح : خبز","opts":["عنب : كرمة","حليب : بقرة","طين : فخّار","شجرة : ظل"],"ans":"ج","why":"مادة خام وما يُصنع منها: الخبز يُصنع من القمح، والفخّار يُصنع من الطين. أما (أ) و(ب) فالثمرة أو الناتج ثم مصدره، وترتيبهما معكوس.","skill":"التناظر اللفظي","src":"mock"},{"id":"mock-q4","n":4,"stem":"جندي : كتيبة","opts":["معلم : درس","طالب : فصل","طبيب : دواء","لاعب : كرة"],"ans":"ب","why":"فرد وجماعته المنظّمة التي ينتمي إليها.","skill":"التناظر اللفظي","src":"mock"},{"id":"mock-q5","n":5,"stem":"مصباح : إضاءة","opts":["كرسي : خشب","مروحة : تبريد","ستارة : نافذة","سجادة : غرفة"],"ans":"ب","why":"أداة ووظيفتها.","skill":"التناظر اللفظي","src":"mock"},{"id":"mock-q6","n":6,"stem":"تردّد : حسم","opts":["يقين : شكّ","بخل : شحّ","صبر : أناة","همّة : عزم"],"ans":"أ","why":"تضاد: التردد ضد الحسم، واليقين ضد الشك. وبقية الخيارات ترادف.","skill":"التناظر اللفظي","src":"mock"},{"id":"mock-q7","n":7,"stem":"رسّام : لوحة","opts":["زائر : متحف","ناقد : لوحة","نحّات : تمثال","تاجر : معرض"],"ans":"ج","why":"مبدع ونتاجه الفني.","skill":"التناظر اللفظي","src":"mock"},{"id":"mock-q8","n":8,"stem":"ذاكر بجدّ طوال الفصل، ......... جاءت نتيجته مرضية.","opts":["لذلك","مع أن","غير أن","كي"],"ans":"أ","why":"النتيجة مترتبة على الجدّ، و«لذلك» أداة نتيجة.","skill":"إكمال الجمل","src":"mock"},{"id":"mock-q9","n":9,"stem":"العلم بلا عمل ......... ، والعمل بلا علم ضلال.","opts":["نور","شجرة بلا ثمر","كنز","طريق"],"ans":"ب","why":"المقابلة مع «ضلال» تقتضي معنى سلبيًّا، و«شجرة بلا ثمر» تفيد انعدام الفائدة.","skill":"إكمال الجمل","src":"mock"},{"id":"mock-q10","n":10,"stem":"......... اشتدّ الظلام ......... اقترب الفجر.","opts":["إذا – لكن","كلما – قرب","مع أن – غير","لأن – كي"],"ans":"ب","why":"تركيب «كلما… قرب» يفيد التلازم بين الأمرين.","skill":"إكمال الجمل","src":"mock"},{"id":"mock-q11","n":11,"stem":"لم يكن اعتراضه على الفكرة ......... للمشروع، وإنما ......... لتحسينه.","opts":["رفضًا – سعيًا","دعمًا – رفضًا","سعيًا – رفضًا","تأييدًا – قبولًا"],"ans":"أ","why":"بنية «لم يكن… وإنما…» تقتضي نفي معنى وإثبات نقيضه، والاعتراض البنّاء سعي للتحسين لا رفض.","skill":"إكمال الجمل","src":"mock"},{"id":"mock-q12","n":12,"stem":"تحتاج النتائج العلمية إلى ......... قبل إعلانها، فالخطأ المنشور يصعب تداركه.","opts":["استعجال","تهويل","إخفاء","تحقّق"],"ans":"د","why":"التعليل بصعوبة تدارك الخطأ يقتضي التثبّت قبل النشر.","skill":"إكمال الجمل","src":"mock"},{"id":"mock-q13","n":13,"stem":"القائد الحكيم يستشير أصحاب الرأي ويستبدّ برأيه دون سواه.","opts":["الحكيم","يستشير","يستبدّ","سواه"],"ans":"ج","why":"الاستبداد يناقض الاستشارة وحكمة القائد.","skill":"الخطأ السياقي","src":"mock"},{"id":"mock-q14","n":14,"stem":"من جدّ وجد، ومن زرع الكسل حصد النجاح.","opts":["جدّ","زرع","الكسل","النجاح"],"ans":"د","why":"المقابلة تقتضي أن يحصد زارع الكسل الفشل، والصواب «حصد الفشل».","skill":"الخطأ السياقي","src":"mock"},{"id":"mock-q15","n":15,"stem":"كانت المحاضرة شائقة مفيدة، فخرج الحضور وهم يتثاءبون من المتعة.","opts":["شائقة","مفيدة","المتعة","يتثاءبون"],"ans":"د","why":"التثاؤب دليل الملل، وهو يناقض وصف المحاضرة بالتشويق.","skill":"الخطأ السياقي","src":"mock"},{"id":"mock-q16","n":16,"stem":"الأمانة صفة تُقرّب صاحبها من الناس وتُبعده عن ثقتهم.","opts":["الأمانة","تُقرّب","تُبعده","ثقتهم"],"ans":"ج","why":"الأمانة تزيد الثقة لا تُبعد عنها؛ الصواب «وتُدنيه من ثقتهم».","skill":"الخطأ السياقي","src":"mock"},{"id":"mock-q17","n":17,"stem":"حافظ على وقتك، فالوقت أثمن من المال؛ لأن المال يُستردّ والوقت يُستردّ.","opts":["أثمن","المال","يُستردّ الأولى","يُستردّ الثانية"],"ans":"د","why":"التعليل يقوم على المقابلة: المال يُستردّ والوقت لا يُستردّ.","skill":"الخطأ السياقي","src":"mock"},{"id":"mock-q18","n":18,"stem":"الفكرة الرئيسة للنص:","opts":["سيرة مخترع المصباح","تاريخ الكهرباء","أن الاختراع تراكم لا لحظة إلهام","أهمية التجربة في العلم"],"ans":"ج","why":"النص يفتتح بنفي تصوّر «لحظة الإلهام» ويقرّر التراكم، وما بعده دليل عليه.","skill":"استيعاب المقروء","src":"mock","p":0},{"id":"mock-q19","n":19,"stem":"ما الذي أضافه المخترع المشهور وفق النص؟","opts":["اكتشف الكهرباء","صنع أول مصنع","أول من أنتج الضوء","اهتدى إلى مادة تصمد للفتيلة"],"ans":"د","why":"النص: «جرّب مئات المواد حتى اهتدى إلى واحدة تصمد»، وصرّح بأن المحاولات السابقة وصلت إلى الضوء.","skill":"استيعاب المقروء","src":"mock","p":0},{"id":"mock-q20","n":20,"stem":"يُفهم من النص أن مؤرخي العلم:","opts":["يفضّلون سؤال التراكم على سؤال النسبة الفردية","ينكرون فضل المخترعين","يهتمون بتواريخ الاختراعات","يرفضون دراسة السير"],"ans":"أ","why":"النص قال إن سؤال «من اخترع» أقل فائدة، وهذا تفضيل لا إنكار.","skill":"استيعاب المقروء","src":"mock","p":0},{"id":"mock-q21","n":21,"stem":"المقصود بـ«تصمد» في النص:","opts":["تُضيء بقوة","تبقى مدة طويلة دون تلف","تكون رخيصة","تُصنع بسهولة"],"ans":"ب","why":"السياق يقابلها بمشكلة «العمر الطويل للفتيلة»، فالصمود هنا طول البقاء.","skill":"استيعا function closeOverlays(){ var o=document.querySelectorAll(".overlay"); for(var i=0;i<o.length;i++) o[i].remove(); }
function ask(opts, onYes){
  closeOverlays();
  var ov = el("div","overlay");
  var bx = el("div","modal");
  bx.setAttribute("role","dialog"); bx.setAttribute("aria-modal","true");
  bx.appendChild(el("h3","",opts.title));

  var no = btn("btn", "إلغاء");

  function esc(e){ if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); close(); } }
  yes.onclick = function(){ close(); onYes(); };
  no.onclick = close;
  ov.onclick = function(e){ if(e.target===ov) close(); };

  row.appendChild(yes); row.appendChild(no);
  bx.appendChild(row); ov.appendChild(bx);

  yes.focus();
}

/* ---------------- routing (the phone's back button moves inside the app) ---------------- */
var view = {screen:"landing"};
function same(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
function sanitize(v){
  if(!v || typeof v!=="object" || !v.screen) return {screen:"home"};
  v = JSON.parse(JSON.stringify(v));
  if(v.screen==="quiz"){
    var dk = deck(v.deck);
    if(!dk || !dk.items.length) return {screen:"home"};
    if(v.deck==="mock" && !S.mockRun) return S.mock ? {screen:"results", deck:"mock"} : {screen:"mockintro"};
    if(typeof v.idx!=="number" || v.idx<0) v.idx = 0;
    if(v.idx>=dk.items.length) v.idx = dk.items.length-1;
  }
  if(v.screen==="unit"){ if(!unitBy(v.unit)) return {screen:"home"}; if(typeof v.tab!=="number") v.tab=0; }
  if(v.screen==="results"){ var d=deck(v.deck); if(!d || d.review || d.flagged) return {screen:"home"}; }
  var known = ["landing","home","unit","quiz","results","glossary","quickref","intro","mockintro"];
  if(known.indexOf(v.screen)<0) return {screen:"home"};
  return v;
}
function go(v, opts){
  opts = opts || {};
  v = sanitize(v);
  var changed = !same(v, view);
  view = v;
  if(v.screen!=="landing"){ S.last = v; save(); markEntered(); }
  try{
    if(changed && !opts.replace) history.pushState({v:v}, "");
    else history.replaceState({v:v}, "");
  }catch(e){}
  closeOverlays();
  render();
  if(!opts.keepScroll) window.scrollTo(0,0);
}
window.addEventListener("popstate", function(e){
  var v = (e.state && e.state.v) ? e.state.v : {screen:"landing"};
  v = sanitize(v);
  view = v;
  if(v.screen!=="landing"){ S.last = v; save(); }
  closeOverlays();
  render();
  window.scrollTo(0,0);
});

function paintTimer(){

  var lab = t.querySelector(".tnum");

  var left = Math.max(0, S.mockRun.endsAt - Date.now());
  var mm = Math.floor(left/60000), ss = Math.floor((left%60000)/1000);
  lab.textContent = mm+":"+(ss<10?"0":"")+ss;

  t.setAttribute("aria-label","الوقت المتبقي "+mm+" دقيقة و"+ss+" ثانية");

  var res = {right:r, total:A.mock.items.length, at:Date.now()};

function renderGlossary(root){
  var m = frame(root, {crumb:homeCrumb(), eyebrow:A.glossary.words.length+" كلمة", title:"معجم المفردات", lede:A.glossary.intro});
  var tb = el("div","toolbar");
  if(gloMode==="list"){
    var lab = el("label","sr","ابحث في المعجم"); lab.htmlFor = "gloSearch"; tb.appendChild(lab);
    var sr = el("input","search"); sr.type = "search"; sr.id = "gloSearch"; sr.placeholder = "ابحث عن كلمة أو معنى…"; sr.value = gloQuery;
    sr.setAttribute("autocomplete","off");
    sr.oninput = function(){ gloQuery = sr.value; paintWords(); };
    tb.appendChild(sr);
  }
  var seg = el("div","seg"); seg.setAttribute("role","group"); seg.setAttribute("aria-label","طريقة العرض");
  var m1 = btn("", "قائمة", function(){ gloMode="list"; render(); });
  var m2 = btn("", "بطاقات", function(){ gloMode="cards"; gloFlipped=false; render(); });
  m1.setAttribute("aria-pressed", gloMode==="list" ? "true":"false");
  m2.setAttribute("aria-pressed", gloMode==="cards" ? "true":"false");
  seg.appendChild(m1); seg.appendChild(m2); tb.appendChild(seg);
  m.appendChild(tb);
  var host = el("div"); host.id = "gloHost"; m.appendChild(host);
  if(gloMode==="list") paintWords(); else paintCard();
}
function paintWords(){
  var host = document.getElementById("gloHost"); if(!host) return;
  clr(host);
  var q = norm(gloQuery.trim());
  var list = A.glossary.words.filter(function(w){ return !q || norm(w[0]).indexOf(q)>-1 || norm(w[1]).indexOf(q)>-1; });
  if(!list.length){
    var e = el("div","empty"); e.appendChild(el("b",null,"لا نتائج لهذا البحث"));
    e.appendChild(el("div",null,"جرّب كلمة أخرى أو جزءًا منها.")); host.appendChild(e); return;
  }
  if(q) host.appendChild(el("div","count", list.length+" نتيجة"));
  var g = el("div","wgrid");
  list.forEach(function(w){ var d=el("div","word"); d.appendChild(el("b",null,w[0])); d.appendChild(el("span",null,w[1])); g.appendChild(d); });
  host.appendChild(g);
}
function paintCard(){
  var host = document.getElementById("gloHost"); if(!host) return;
  clr(host);
  var W = A.glossary.words, w = W[gloIdx];
  var c = btn("flipcard");
  c.appendChild(el("div","w", gloFlipped ? w[1] : w[0]));
  if(gloFlipped) c.appendChild(el("div","m", w[0]));
  c.appendChild(el("div","hx", gloFlipped ? "اضغط للبطاقة التالية" : "اضغط لعرض المعنى"));
  c.setAttribute("aria-live","polite");
  c.onclick = function(){ if(gloFlipped){ gloIdx=(gloIdx+1)%W.length; gloFlipped=false; } else gloFlipped=true; paintCard(); var f=document.querySelector(".flipcard"); if(f) f.focus(); };
  host.appendChild(c);
  var nav = el("div","cnav");
  nav.appendChild(btn("btn","→ السابق", function(){ gloIdx=(gloIdx-1+W.length)%W.length; gloFlipped=false; paintCard(); }));
  nav.appendChild(el("div","sp tnum", of(gloIdx+1, W.length)));
  nav.appendChild(btn("btn","التالي ←", function(){ gloIdx=(gloIdx+1)%W.length; gloFlipped=false; paintCard(); }));
  host.appendChild(nav);
}

/* ---------------- shell ---------------- */
function render(){
  var root = clr(document.getElementById("view"));
  root.className = "";
  document.documentElement.classList.toggle("on-landing", view.screen==="landing");
  var st = stat(ALL);
  var mask = document.getElementById("progMask"), lab = document.getElementById("progLab");
  if(mask) mask.style.width = (100-pct(st.done, st.total))+"%";
  if(lab){ clr(lab); lab.appendChild(el("b",null,of(st.done, st.total))); lab.appendChild(document.createTextNode(" سؤالًا")); }
  var prog = document.getElementById("prog"); if(prog) prog.setAttribute("aria-label","تقدّمك: "+of(st.done, st.total)+" سؤالًا");
  if(view.screen==="unit") root.classList.add(view.unit);
  var fn = {landing:renderLanding, home:renderHome, unit:renderUnit, quiz:renderQuiz, results:renderResults,
            glossary:renderGlossary, quickref:renderQuickref, intro:renderIntro, mockintro:renderMockIntro}[view.screen] || renderHome;
  fn(root);
  var h1 = root.querySelector("h1");
  document.title = view.screen==="landing" ? "ملزمة اللفظي التفاعلية" : ((h1 ? h1.textContent+" · " : "")+"القسم اللفظي");
}

document.getElementById("themeBtn").onclick = toggleTheme;
document.getElementById("homeBtn").onclick = function(){ go({screen:"home"}); };
try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ if(!S.theme) applyTheme(); }); }catch(e){}
applyTheme();

document.addEventListener("keydown", function(e){
  if(view.screen!=="quiz" || document.querySelector(".overlay")) return;
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  var dk = deck(view.deck); if(!dk) return;
  if(e.key==="ArrowLeft" && view.idx<dk.items.length-1){ e.preventDefault(); go({screen:"quiz", deck:dk.id, idx:view.idx+1}); return; }
  if(e.key==="ArrowRight" && view.idx>0){ e.preventDefault(); go({screen:"quiz", deck:dk.id, idx:view.idx-1}); return; }
  var i = ["1","2","3","4","١","٢","٣","٤"].indexOf(e.key) % 4;
  if(["1","2","3","4","١","٢","٣","٤"].indexOf(e.key)>-1){
    var q = dk.items[view.idx], a = S.answers[q.id];
    if(!a || dk.exam || (dk.review && !a.ok)) answer(dk, q, L[i], !!dk.exam);
  }
});

/* ---------------- boot ---------------- */
var expired = S.mockRun && S.mockRun.endsAt <= Date.now();
if(expired) finalizeMock();
if(entered() && S.last && S.last.screen && S.last.screen!=="landing") view = sanitize(S.last);
else view = {screen:"landing"};
try{ history.replaceState({v:view}, ""); }catch(e){}
render();
if(expired) toast("انتهى وقت اختبارك التجريبي وأنت خارج الصفحة، وصُحّحت إجاباتك تلقائيًّا.");
})();

</script>
