*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0; color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.8;
  direction:rtl; text-align:right; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-weight:700; line-height:1.35; margin:0; text-wrap:balance}
p{margin:0}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--u); outline-offset:2px; border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.ic{display:inline-grid; width:1.15em; height:1.15em; flex:none; line-height:0}
.ic svg{width:100%; height:100%}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ================= landing (one look in both themes) ================= */
html.on-landing, html.on-landing body{background:#131D33}
html.on-landing .topbar{display:none}
.landing{color:#fff; position:relative; min-height:100vh; min-height:100svh; display:flex; align-items:center;
  background:
    radial-gradient(900px 620px at 108% -12%, rgba(74,98,196,.36), transparent 62%),
    radial-gradient(760px 520px at -18% 108%, rgba(26,140,119,.30), transparent 62%),
    #131D33}
.lwrap{width:100%; max-width:1180px; margin:0 auto; padding:16px}
.lframe{border:1.5px solid rgba(255,255,255,.14); border-radius:24px;
  padding:clamp(20px,4.2vw,52px); display:flex; flex-direction:column; gap:clamp(26px,4vw,44px)}
.ltop{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.lpill{font-size:clamp(14px,1.9vw,18px); padding:7px 18px; border-radius:99px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); white-space:nowrap}
.lpill b{font-weight:800; margin-inline-start:3px}
.lbadge{font-size:clamp(14px,1.9vw,18px); padding:7px 18px; border-radius:99px; white-space:nowrap;
  background:#1A8C77; box-shadow:0 8px 24px -10px #1A8C77}
.lgrid{display:grid; grid-template-columns:1fr; gap:clamp(30px,4vw,56px); align-items:center}
@media (min-width:1040px){ .lgrid{grid-template-columns:minmax(0,1fr) 410px} }
.lmain{container-type:inline-size; min-width:0}
.leyebrow{font-size:clamp(17px,2.3vw,25px); color:#A9B8D6}
.lh1{font-weight:400; line-height:1.12; margin-top:4px; letter-spacing:-.01em; font-size:clamp(40px,8vw,92px)}
@supports (font-size:1cqi){ .lh1{font-size:clamp(40px,16cqi,104px); white-space:nowrap} }
.lsub{font-size:clamp(16px,2.1vw,22px); color:#D6DEEE; margin-top:12px}
.lrule{height:5px; width:150px; border-radius:9px; margin-top:22px; background:var(--rainbow)}
.lnote{font-size:clamp(14.5px,1.7vw,17px); color:#C5CFE2; margin-top:14px; max-width:54ch; line-height:1.85}
.lcta{display:flex; gap:10px; flex-wrap:wrap; margin-top:28px; align-items:center}
.go{display:inline-flex; align-items:center; gap:14px; background:#FFFFFF; color:#131D33; border:0;
  border-radius:16px; padding:15px 30px; font-size:19px; font-weight:800; white-space:nowrap;
  box-shadow:0 16px 34px -16px rgba(0,0,0,.75);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s}
.go:hover{transform:translateY(-2px); box-shadow:0 20px 40px -16px rgba(0,0,0,.8)}
.go .arr{font-size:21px; line-height:1; transition:transform .18s}
.go:hover .arr{transform:translateX(-4px)}
.go2{border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.07); color:#FFFFFF;
  border-radius:16px; padding:14px 22px; font-size:16px}
.go2:hover{background:rgba(255,255,255,.12)}
.lprog{display:flex; align-items:center; gap:12px; margin-top:18px; color:#A9B8D6; font-size:14px; flex-wrap:wrap}
.lprog b{color:#FFFFFF; font-weight:800}
.rbar{position:relative; display:block; height:6px; border-radius:99px; background:var(--rainbow); overflow:hidden}
.rbar i{position:absolute; top:0; bottom:0; inset-inline-end:0; background:#2A3551; transition:width .6s cubic-bezier(.2,.7,.3,1)}
.lprog .rbar{width:170px}

.lsheet{container-type:inline-size; display:grid; grid-template-columns:1fr 1fr; gap:12px clamp(12px,3vw,24px);
  padding:22px clamp(16px,4vw,24px); border-radius:18px;
  background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.10)}
.lrow{display:flex; align-items:center; gap:2cqi}
.lrow i{font-style:normal; font-size:13px; color:#8C9BBB; width:7cqi; text-align:center; flex:none}
.lrow span{width:24px; height:24px; width:min(29px,7.4cqi); height:min(29px,7.4cqi);
  border-radius:50%; flex:none; border:1.6px solid rgba(255,255,255,.34);
  display:grid; place-items:center; font-size:12px; font-size:min(14px,3.5cqi); color:rgba(255,255,255,.55); line-height:1}
.lrow span.on{color:#FFFFFF; background:var(--c); border-color:var(--c);
  animation:ink .5s cubic-bezier(.2,.7,.3,1) both; animation-delay:var(--d)}
@keyframes ink{
  from{background:transparent; border-color:rgba(255,255,255,.34); color:rgba(255,255,255,.55); transform:scale(.82)}
  to{background:var(--c); border-color:var(--c); color:#FFFFFF; transform:scale(1)}}
.lskills{list-style:none; margin:14px 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:9px}
.lskills li:last-child{grid-column:1 / -1}
@media (max-width:480px){ .lskills{grid-template-columns:1fr} }
.lskill{width:100%; display:flex; align-items:center; gap:11px; font-size:16px; padding:10px 14px;
  border-radius:12px; background:rgba(255,255,255,.05); border:1px solid transparent; color:#FFFFFF;
  text-align:right; transition:background .15s, border-color .15s}
.lskill:hover{background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.18)}
.lskill .dot{width:12px; height:12px; border-radius:50%; flex:none}
.lskill .nm{flex:1}
.lskill .n{font-size:13px; color:#8C9BBB}
.lfoot{display:flex; justify-content:space-between; align-items:flex-end; gap:16px 24px; flex-wrap:wrap;
  border-top:1px solid rgba(255,255,255,.10); padding-top:22px}
.lby small{display:block; font-size:16px; color:#A9B8D6}
.lby strong{display:block; font-weight:400; font-size:clamp(30px,5vw,48px); line-height:1.25}
.lmeta{font-size:15px; color:#A9B8D6; line-height:1.75; text-align:end}
.lmeta b{color:#FFFFFF; font-weight:800}

/* ================= app chrome ================= */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:var(--band); color:var(--on-band);
  border-bottom:1px solid rgba(255,255,255,.06)}
.topbar-in{max-width:1120px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:11px; min-width:0; flex:1; border:0; background:none; padding:0;
  color:inherit; text-align:right}
.mark{width:36px; height:36px; flex:none}
.brand-t{min-width:0}
.brand-t b{display:block; font-size:16px; font-weight:800; line-height:1.35}
.brand-t span{display:block; font-size:11.5px; color:var(--on-band-2); line-height:1.5;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.prog{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--on-band-2)}
.prog .rbar{width:150px}
.prog b{color:var(--on-band); font-weight:700}
.iconbtn{width:38px; height:38px; flex:none; border-radius:11px; display:grid; place-items:center; font-size:18px;
  border:1px solid var(--on-band-line); background:var(--on-band-fill); color:var(--on-band)}
.iconbtn:hover{background:rgba(255,255,255,.13)}
@media (max-width:640px){
  .prog{order:3; flex-basis:100%}
  .prog .rbar{flex:1; width:auto}
}

.band{position:relative; background:var(--band); color:var(--on-band); overflow:hidden}
.band::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(640px 360px at 104% -30%, var(--u-glow), transparent 64%),
    radial-gradient(520px 300px at -10% 130%, rgba(26,140,119,.16), transparent 62%)}
.band-in{position:relative; max-width:1120px; margin:0 auto; padding:20px 16px 70px}
.band .eyebrow{font-size:14px; color:var(--on-band-2)}
.band h1{font-size:clamp(27px,4.6vw,42px); font-weight:800; margin-top:2px}
.band .lede{color:#D6DEEE; font-size:15px; margin-top:8px; max-width:64ch; line-height:1.85}
.band-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.band-row .grow{flex:1; min-width:0}
.crumb{display:inline-flex; align-items:center; gap:8px; margin-bottom:16px; border-radius:99px; padding:5px 15px;
  border:1px solid var(--on-band-line); background:var(--on-band-fill); color:var(--on-band); font-size:13.5px}
.crumb:hover{background:rgba(255,255,255,.13)}
main.page{position:relative; max-width:1120px; margin:-44px auto 0; padding-inline:16px; padding-block:0 72px}

/* ================= dashboard ================= */
.tiles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:20px; max-width:620px}
.tile{border-radius:14px; padding:12px 14px; background:var(--on-band-fill); border:1px solid var(--on-band-line)}
.tile b{display:block; font-size:clamp(19px,3vw,25px); font-weight:800; line-height:1.3; white-space:nowrap}
.tile span{display:block; font-size:12.5px; color:var(--on-band-2); line-height:1.5}
.tile.ok b{color:#6FE0A6} .tile.no b{color:#FFB4A6}
.resume{margin-top:18px; display:inline-flex; align-items:center; gap:12px; border:0; border-radius:14px;
  background:#FFFFFF; color:#131D33; padding:12px 22px; font-size:16px; font-weight:800;
  box-shadow:0 14px 30px -16px rgba(0,0,0,.8)}
.resume:hover{transform:translateY(-1px)}
.sec-h{display:flex; align-items:baseline; gap:12px; margin:34px 0 14px; flex-wrap:wrap}
.sec-h:first-child{margin-top:0}
.sec-h h2{font-size:19px; font-weight:800}
.sec-h .hint{font-size:13px; color:var(--ink-3)}
.sec-h.on-band{margin:34px 0 0}
.sec-h.on-band h2{color:var(--on-band)}
.sec-h.on-band .hint{color:var(--on-band-2)}
.ugrid{display:grid; gap:14px; grid-template-columns:1fr}
@media (min-width:700px){ .ugrid{grid-template-columns:1fr 1fr} .ugrid > :last-child:nth-child(odd){grid-column:1 / -1} }
@media (min-width:1000px){ .ugrid{grid-template-columns:repeat(6,1fr)} .ugrid > *{grid-column:span 2}
  .ugrid > :nth-child(4), .ugrid > :nth-child(5){grid-column:span 3} .ugrid > :last-child:nth-child(odd){grid-column:span 3} }
.ucard{width:100%; text-align:right; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column; gap:14px; position:relative; overflow:hidden;
  transition:transform .18s cubic-bezier(.2,.7,.3,1), border-color .18s}
.ucard:hover{transform:translateY(-3px); border-color:var(--u)}
.uc-top{display:flex; align-items:center; gap:13px; position:relative; z-index:1}
.ubub{width:42px; height:42px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--u);
  color:#FFFFFF; font-weight:800; font-size:18px; box-shadow:0 6px 16px -8px var(--u)}
.ubub.lg{width:52px; height:52px; font-size:22px}
.uc-eb{font-size:12.5px; color:var(--ink-3); line-height:1.5}
.ucard h3{font-size:18.5px; font-weight:800}
.dots{display:flex; flex-wrap:wrap; gap:3px; position:relative; z-index:1}
.dot{width:8px; height:8px; border-radius:50%; border:1.4px solid var(--line-2); background:transparent}
.dot.r{background:var(--right); border-color:var(--right)}
.dot.w{background:var(--wrong); border-color:var(--wrong)}
.uc-foot{display:flex; align-items:center; gap:12px; font-size:13px; color:var(--ink-3); position:relative; z-index:1}
.ubar{flex:1; height:6px; border-radius:99px; background:var(--sunken); overflow:hidden}
.ubar i{display:block; height:100%; background:var(--u); border-radius:99px}
.chip{border-radius:99px; padding:2px 11px; font-size:12px; white-space:nowrap; font-weight:700}
.chip.done{background:var(--right-soft); color:var(--right)}
.chip.go-on{background:var(--u-soft); color:var(--u-ink)}
.pgrid{display:grid; gap:14px; grid-template-columns:1fr}
@media (min-width:700px){ .pgrid{grid-template-columns:1fr 1fr} }
@media (min-width:1000px){ .pgrid{grid-template-columns:repeat(3,1fr)} }
.pcard{width:100%; text-align:right; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column; gap:10px;
  transition:transform .18s cubic-bezier(.2,.7,.3,1), border-color .18s}
.pcard:hover:not(:disabled){transform:translateY(-3px); border-color:var(--line-2)}
.pcard:disabled{opacity:.6}
.pc-top{display:flex; align-items:center; gap:12px}
.pc-ic{width:42px; height:42px; flex:none; border-radius:13px; display:grid; place-items:center; font-size:21px;
  background:var(--sunken); color:var(--ink)}
.pcard h3{font-size:17px; font-weight:800}
.pcard p{font-size:14px; color:var(--ink-2); line-height:1.75}
.pc-foot{margin-top:auto; font-size:13px; color:var(--ink-3); display:flex; align-items:center; gap:8px}
.pc-foot b{color:var(--ink); font-weight:700}
.dfoot{margin-top:40px; padding-top:22px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px 18px;
  align-items:center; justify-content:space-between; color:var(--ink-3); font-size:13.5px}
.dfoot .acts{display:flex; gap:8px; flex-wrap:wrap}

/* ================= shared blocks ================= */
.btn{border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px;
  padding:10px 18px; font-size:15px; display:inline-flex; align-items:center; gap:8px;
  transition:border-color .15s, background .15s, filter .15s}
.btn:hover:not(:disabled){border-color:var(--line-2)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--u-btn); border-color:var(--u-btn); color:var(--u-btn-ink); font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-3)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--wrong)}
.panel{display:flex; flex-direction:column; gap:16px}
.prose{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; box-shadow:var(--shadow)}
.prose h3{font-size:17.5px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:10px}
.prose h3::before{content:""; width:9px; height:9px; border-radius:50%; background:var(--u); flex:none}
.prose p{color:var(--ink-2)}
.prose p + p{margin-top:10px}
.li{display:flex; gap:10px}
.li + .li{margin-top:6px}
.li > i{font-style:normal; color:var(--u); flex:none; font-weight:800}
.note{border-radius:var(--r-sm); padding:14px 16px; font-size:14.5px; line-height:1.8; background:var(--flag-soft); color:var(--ink);
  border:1px solid color-mix(in srgb, var(--flag) 30%, transparent)}
.quote{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:16px 18px;
  font-size:17.5px; line-height:2.05; color:var(--ink)}
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); margin-top:12px}
table{border-collapse:collapse; width:100%; min-width:460px; font-size:14px}
th{background:var(--navy); color:#FFFFFF; font-weight:700; padding:10px 13px; text-align:right; font-size:13.5px}
td{padding:10px 13px; border-top:1px solid var(--line); color:var(--ink-2); vertical-align:top; line-height:1.75}
tr:nth-child(even) td{background:var(--surface-2)}
td:first-child{color:var(--ink); font-weight:700}
.muted{font-size:13.5px; color:var(--ink-3); margin-top:10px}

/* unit */
.tabs{display:flex; flex-wrap:wrap; gap:7px; margin-top:20px}
.tab{border:1px solid var(--on-band-line); background:var(--on-band-fill); color:var(--on-band-2); border-radius:99px;
  padding:8px 17px; font-size:14.5px; white-space:nowrap; display:inline-flex; align-items:center; gap:8px}
.tab:hover{color:var(--on-band)}
.tab[aria-selected="true"]{background:#FFFFFF; border-color:#FFFFFF; color:#131D33; font-weight:800}
.tab[aria-selected="true"]::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--u)}
.strat{display:flex; gap:14px; padding:17px 18px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--shadow)}
.strat .num{width:32px; height:32px; flex:none; border-radius:50%; display:grid; place-items:center;
  border:1.6px solid var(--u); color:var(--u-ink); font-size:14px; font-weight:800}
.strat h4{font-size:16px; font-weight:800; margin-bottom:3px}
.strat p{font-size:14.5px; color:var(--ink-2)}
.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.ex-h{padding:12px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--u-soft)}
.ex-h b{font-size:14.5px; font-weight:800; color:var(--u-ink)}
.ex-h span{font-size:12.5px; color:var(--ink-3)}
.ex-b{padding:18px; display:flex; flex-direction:column; gap:14px}
details.sol summary{cursor:pointer; list-style:none; font-size:14px; font-weight:700; color:var(--u-ink);
  border:1.5px dashed var(--line-2); border-radius:var(--r-sm); padding:10px 14px; display:flex; align-items:center; gap:8px}
details.sol summary::-webkit-details-marker{display:none}
details.sol summary:hover{border-color:var(--u)}
details.sol[open] summary{margin-bottom:12px}
.steps{display:flex; flex-direction:column; gap:8px; padding:14px 16px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--r-sm)}
.steps > b{font-size:13.5px; color:var(--u-ink); font-weight:800}
.step{display:flex; gap:10px; font-size:14.5px; color:var(--ink-2); line-height:1.8}
.step > i{font-style:normal; flex:none; width:7px; height:7px; border-radius:50%; background:var(--u); margin-top:.72em}
.tip{border-radius:var(--r-sm); padding:12px 15px; font-size:14px; background:var(--u-soft); color:var(--ink);
  border:1px solid color-mix(in srgb, var(--u) 28%, transparent)}
.tip b{color:var(--u-ink)}
.next{display:flex; justify-content:center; margin-top:8px}

/* question */
.stem{font-size:19px; line-height:1.95; color:var(--ink)}
.opts{display:grid; gap:9px; grid-template-columns:1fr}
@media (min-width:560px){ .opts.short{grid-template-columns:1fr 1fr} }
.opt{display:flex; align-items:center; gap:12px; width:100%; text-align:right; background:var(--surface);
  border:1.5px solid var(--line); border-radius:var(--r-sm); padding:11px 13px; font-size:16.5px; line-height:1.65; color:var(--ink);
  transition:border-color .14s, background .14s}
@media (hover:hover) and (pointer:fine){ .opt:not(.static):hover:not(:disabled){border-color:var(--u); background:var(--opt-hover)} }
.opt.static{cursor:default}
.opt .k{width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:14px; line-height:1;
  border:1.6px solid var(--line-2); color:var(--ink-3); background:var(--surface); transition:background .14s, border-color .14s}
.opt.is-right{border-color:var(--right); background:var(--right-soft)}
.opt.is-right .k{background:var(--right); border-color:var(--right); color:#FFFFFF}
.opt.is-wrong{border-color:var(--wrong); background:var(--wrong-soft)}
.opt.is-wrong .k{background:var(--wrong); border-color:var(--wrong); color:#FFFFFF}
.opt.is-sel{border-color:var(--u); background:var(--u-soft)}
.opt.is-sel .k{background:var(--u); border-color:var(--u); color:#FFFFFF}
.verdict{display:flex; align-items:center; gap:9px; font-size:15.5px; font-weight:800}
.verdict.r{color:var(--right)} .verdict.w{color:var(--wrong)}
.verdict .ic{width:26px; height:26px; padding:5px; border-radius:50%; color:#FFFFFF}
.verdict.r .ic{background:var(--right)} .verdict.w .ic{background:var(--wrong)}
.qhead-side{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums; font-size:22px; font-weight:800; border-radius:12px; padding:5px 16px;
  background:var(--on-band-fill); border:1px solid var(--on-band-line); color:var(--on-band); display:inline-flex; align-items:center; gap:8px; direction:ltr}
.timer.low{color:#FFB4A6; border-color:#FFB4A6}
.bandbtn{border:0; border-radius:12px; background:#FFFFFF; color:#131D33; padding:9px 16px; font-size:14.5px; font-weight:800}
.counts{font-size:14px; color:var(--on-band-2)}
.counts b{color:var(--on-band); font-weight:800}
.sheet{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
  padding:14px 16px; margin-bottom:16px}
.sheet-h{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-3); margin-bottom:10px; flex-wrap:wrap}
.legend{display:flex; gap:12px; flex-wrap:wrap}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:9px; height:9px; border-radius:50%; display:inline-block}
.bubs{display:flex; flex-wrap:wrap; gap:6px}
.bub{width:32px; height:32px; border-radius:50%; border:1.6px solid var(--line-2); background:var(--surface); color:var(--ink-3);
  font-size:12.5px; display:grid; place-items:center; font-variant-numeric:tabular-nums; position:relative; padding:0;
  transition:transform .12s}
.bub:hover{transform:scale(1.1)}
.bub.r{background:var(--right); border-color:var(--right); color:#FFFFFF}
.bub.w{background:var(--wrong); border-color:var(--wrong); color:#FFFFFF}
.bub.a{background:var(--u); border-color:var(--u); color:#FFFFFF}
.bub.cur{box-shadow:0 0 0 2.5px var(--surface), 0 0 0 4.5px var(--u)}
.bub.fl::after{content:""; position:absolute; top:-3px; left:-3px; width:10px; height:10px; border-radius:50%;
  background:var(--flag); border:2px solid var(--surface)}
.qcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
  padding:20px; display:flex; flex-direction:column; gap:16px}
.qmeta{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--line)}
.tag{font-size:12.5px; color:var(--u-ink); background:var(--u-soft); border-radius:99px; padding:3px 12px; font-weight:700}
.flagbtn{border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:4px 12px; font-size:12.5px;
  color:var(--ink-3); display:inline-flex; align-items:center; gap:6px}
.flagbtn.on{background:var(--flag-soft); color:var(--flag); border-color:transparent; font-weight:700}
.why{display:flex; flex-direction:column; gap:6px; padding:14px 16px; background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-sm); font-size:15px; color:var(--ink-2); line-height:1.9}
.why b{font-size:13.5px; color:var(--u-ink); font-weight:800}
.qnav{display:flex; gap:10px; align-items:center; margin-top:18px}
.qnav .sp{flex:1}
.kbd{margin-top:16px; font-size:12.5px; color:var(--ink-3); text-align:center}
@media (hover:none){ .kbd{display:none} }

/* results */
.score{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
  padding:22px; display:flex; gap:24px; align-items:center; flex-wrap:wrap; margin-bottom:18px}
.ring{width:124px; height:124px; flex:none; border-radius:50%; display:grid; place-items:center; position:relative}
.ring .mid{position:absolute; inset:10px; border-radius:50%; background:var(--surface); display:grid; place-items:center; align-content:center; line-height:1.25; text-align:center}
.ring b{font-size:30px; font-weight:800; display:block}
.ring span{font-size:12px; color:var(--ink-3)}
.score-t{flex:1; min-width:220px}
.score-t h2{font-size:21px; font-weight:800; margin-bottom:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.score-t p{color:var(--ink-2); font-size:15px}
.breakdown{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.brow{display:flex; align-items:center; gap:12px; font-size:14px}
.brow .nm{width:118px; flex:none; color:var(--ink-2)}
.brow .ubar{height:9px}
.brow .vl{width:62px; flex:none; text-align:left; color:var(--ink-3)}
.acts{display:flex; gap:9px; flex-wrap:wrap}
.rev{display:flex; flex-direction:column; gap:12px; margin-top:14px}
.rev-item{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:15px 17px;
  display:flex; flex-direction:column; gap:8px; position:relative}
.rev-item::before{content:""; position:absolute; top:14px; bottom:14px; right:0; width:3px; border-radius:3px 0 0 3px; background:var(--wrong)}
.rev-item.ok::before{background:var(--right)}
.rev-item.na::before{background:var(--line-2)}
.rev-item .q{font-size:16px; line-height:1.85; color:var(--ink)}
.rev-line{font-size:14px; color:var(--ink-2); line-height:1.8}
.rev-line b{color:var(--ink)}
.rev-top{display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap}
.pill{font-size:12px; border-radius:99px; padding:2px 11px; border:1px solid var(--line); color:var(--ink-3)}
.pill.r{color:var(--right); border-color:transparent; background:var(--right-soft); font-weight:700}
.pill.w{color:var(--wrong); border-color:transparent; background:var(--wrong-soft); font-weight:700}

/* glossary */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.search{flex:1; min-width:200px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:12px; padding:11px 15px; font-size:15.5px; font-family:inherit}
.search::placeholder{color:var(--ink-3)}
.search:focus{outline:none; border-color:var(--u)}
.seg{display:inline-flex; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:3px; gap:3px}
.seg button{border:0; background:none; border-radius:9px; padding:7px 16px; font-size:14.5px; color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--navy); color:#FFFFFF; font-weight:700}
.wgrid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.word{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:13px 15px;
  display:flex; justify-content:space-between; gap:12px; align-items:baseline}
.word b{font-size:18px; font-weight:800}
.word span{font-size:14px; color:var(--ink-2); text-align:left}
.count{font-size:13px; color:var(--ink-3); margin-bottom:10px}
.flipcard{width:100%; min-height:230px; border:0; border-radius:22px; padding:34px 20px; text-align:center; color:#FFFFFF;
  display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center;
  background:radial-gradient(520px 260px at 100% 0%, rgba(74,98,196,.45), transparent 65%),
             radial-gradient(420px 240px at 0% 100%, rgba(26,140,119,.35), transparent 65%), #131D33;
  box-shadow:0 20px 44px -24px rgba(19,29,51,.9)}
.flipcard .w{font-size:clamp(30px,6vw,44px); font-weight:800; line-height:1.4}
.flipcard .m{font-size:19px; color:#A9B8D6}
.flipcard .hx{font-size:13px; color:#8C9BBB}
.cnav{display:flex; gap:10px; align-items:center; margin-top:14px}
.cnav .sp{flex:1; text-align:center; color:var(--ink-3); font-size:14px}
.empty{text-align:center; padding:44px 20px; color:var(--ink-3); background:var(--surface); border:1.5px dashed var(--line-2); border-radius:var(--r)}
.empty b{display:block; font-size:17px; color:var(--ink); margin-bottom:6px}

/* overlay + toast */
.overlay{position:fixed; inset:0; z-index:200; background:rgba(10,17,32,.6); display:grid; place-items:center;
  padding:20px; padding-top:calc(20px + env(safe-area-inset-top,0px))}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:0 30px 70px -24px rgba(0,0,0,.7);
  padding:24px 24px 20px; max-width:440px; width:100%}
.modal h3{font-size:18.5px; font-weight:800; margin-bottom:8px}
.modal p{font-size:15px; color:var(--ink-2); line-height:1.85}
.mrow{display:flex; gap:9px; margin-top:20px; flex-wrap:wrap}
.toast{position:fixed; z-index:210; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:#131D33; color:#FFFFFF; border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:12px 18px; font-size:14.5px;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.8); max-width:calc(100% - 32px); width:max-content; animation:up .25s ease both}
@keyframes up{from{opacity:0; transform:translate(-50%,8px)} to{opacity:1; transform:translate(-50%,0)}}

@media (max-width:400px){ .go{padding:14px 22px; font-size:17px; gap:10px} .tab{padding:7px 13px; font-size:14px} }
@media (max-width:520px){
  .prose{padding:17px 16px} .qcard{padding:16px} .score{padding:18px 16px} .ex-b{padding:15px}
  .stem{font-size:18px} .brow .nm{width:92px}
  .tiles{gap:8px; grid-template-columns:1fr 1fr} .tiles .tile:first-child{grid-column:1 / -1} .tile{padding:10px 12px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
